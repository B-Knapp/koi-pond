  update(e) { if (e.t > 18 || e.gone) e.done = true; },
  prey(e, kind, out) { if (kind === 'insect' && !e.gone) { const z = this.z(e); out.push({ x: e.p.x - z * 45 * U, y: e.p.y - z * 65 * U, take() { e.gone = true; } }); } },
  z(e) { return e.t < 6 ? 1 - e.t / 6 * 0.9 : e.t < 12 ? 0.1 + Math.sin(e.t * 2) * 0.03 : Math.min(1, 0.1 + (e.t - 12) / 6); },
  draw(e, c, l) { if (l !== 'top' || e.gone) return; const z = this.z(e), x = e.p.x - z * 45 * U, y = e.p.y - z * 65 * U, s = U * (1.6 + z);
    c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = Math.max(PXW, 0.5 * U); c.beginPath(); c.moveTo(x - 200 * U, y - 290 * U); c.lineTo(x, y); c.stroke();
    c.fillStyle = 'rgba(0,0,0,0.2)'; c.beginPath(); c.arc(e.p.x + 3 * U, e.p.y + 4 * U, 3 * U, 0, TAU); c.fill();
    c.strokeStyle = '#1a1410'; c.lineWidth = Math.max(PXW, 0.6 * s); c.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; c.moveTo(x, y); c.lineTo(x + Math.cos(a) * 5 * s, y + Math.sin(a) * 5 * s); } c.stroke(); blob(c, x, y, 2.2 * s, 2.2 * s, '#2a2018'); } };
EV.mantis = { title: 'A praying mantis waits on a lily pad', w: 1,
  init(e) { if (!pads.length) { e.done = true; return; } e.p = rnd(pads); e.off = { x: (R() - 0.5) * e.p.r * 0.5, y: (R() - 0.5) * e.p.r * 0.5 }; e.a = R() * TAU; e.strike = 0; e.ate = 0; },
  update(e, dt) {
    const q = padPos(e.p); e.x = q.x + e.off.x; e.y = q.y + e.off.y; e.strike = Math.max(0, e.strike - dt);
    for (const b of insectTargets()) { const d = Math.hypot(b.x - e.x, b.y - e.y); if (d < 90 * U) { e.a += angDiff(e.a, Math.atan2(b.y - e.y, b.x - e.x)) * Math.min(1, dt * 3); if (d < 45 * U && !e.strike) { e.strike = 0.4; b.take(); e.ate++; } break; } }
    if (e.t > 40) e.done = true;
  },
  draw(e, c, l) { if (l !== 'top') return; const s = U * 1.7, st = e.strike > 0 ? 5 : 0; c.save(); c.translate(e.x, e.y); c.rotate(e.a);
    outlined(c, () => { c.strokeStyle = '#7ab040'; c.lineWidth = 1.2 * s; c.beginPath(); for (const sd of [1, -1]) { c.moveTo(-2 * s, 0); c.lineTo(-6 * s, sd * 6 * s); c.moveTo(-6 * s, 0); c.lineTo(-10 * s, sd * 5 * s); c.moveTo(4 * s, 0); c.lineTo((8 + st) * s, sd * 2 * s); c.lineTo((6 + st) * s, sd * 3.5 * s); } c.stroke();
      blob(c, -6 * s, 0, 6 * s, 2.2 * s, '#8ac848'); blob(c, 2 * s, 0, 4 * s, 1.2 * s, '#8ac848'); blob(c, 7 * s, 0, 2 * s, 2.6 * s, '#9ad858'); });
    c.restore(); } };

/* ---------- the pond's plants ---------- */
EV.newpad = { title: 'A new lily pad unfurls', w: 1,
  init(e) {
    if (pads.length > 10) { e.done = true; return; }
    for (let i = 0; i < 30; i++) { const r = (38 + R() * 30) * U, p = pondPt(r + 30 * U);
      if (pads.every(q => Math.hypot(q.x - p.x, q.y - p.y) > q.r + r + 10 * U)) { e.pad = { x: p.x, y: p.y, r, rot: R() * TAU, ph: R() * 100, sprite: padSprite(r), grow: 0 }; pads.push(e.pad); return; } }
    e.done = true;
  },
  update(e) { e.pad.grow = Math.min(1, e.t / 10); if (e.pad.grow >= 1) { delete e.pad.grow; e.done = true; } } };
EV.flowersclose = { title: 'The water lilies close for a while', w: 1,
  init(e) {
    if (!pads.some(p => p.flower) && pads.length) { const p = rnd(pads); p.flower = flowerSprite(p.r * 0.42); p.fx = (R() - 0.5) * p.r * 0.5; p.fy = (R() - 0.5) * p.r * 0.5; }
    e.list = pads.filter(p => p.flower && p.bloom === undefined); if (!e.list.length) e.done = true;
  },
  update(e) { const b = e.t < 8 ? 1 - e.t / 8 * 0.85 : e.t < 25 ? 0.15 : Math.min(1, 0.15 + (e.t - 25) / 8 * 0.85); for (const p of e.list) p.bloom = b; if (e.t > 33) { for (const p of e.list) delete p.bloom; e.done = true; } } };
EV.hyacinth = mkFloater('A water hyacinth raft floats by', 2, { size: 2.2, r: 14, sp: 6, life: 50, spin: 0.08 }, (c, s) => {
  for (let i = 0; i < 6; i++) { const a = i / 6 * TAU; blob(c, Math.cos(a) * 7 * s, Math.sin(a) * 7 * s, 5 * s, 3.4 * s, '#4f9a3a', a); }
  for (let i = 0; i < 9; i++) { const a = i * 2.4; blob(c, Math.cos(a) * 3 * s, Math.sin(a) * 3 * s, 2.4 * s, 2.4 * s, i % 3 ? '#9a7ad8' : '#b89af0'); }
  blob(c, 0, 0, 1.4 * s, 1.4 * s, '#f6d23a');
});
EV.reedfluff = mkFall('Cattail fluff bursts and drifts', 2, { colors: ['#e8e0cc', '#d8cfb8'], size: 4, fall: 0.07, wind: 30, life: 18, shape: 'fluff' }, 12, 5);
EV.lotusleaf = { title: 'A great lotus leaf rises above the water', w: 1,
  init(e) { e.p = pondPt(140 * U); e.r = 70 * U; },
  update(e) { e.k = Math.min(1, e.t / 6, Math.max(0, (50 - e.t) / 6)); if (e.t > 50) e.done = true; },
  draw(e, c, l) {
    if (l !== 'top') return; const r = e.r * e.k, k = e.k;
    c.fillStyle = `rgba(0,0,0,${0.25 * k})`; c.beginPath(); c.arc(e.p.x + 40 * U, e.p.y + 55 * U, r, 0, TAU); c.fill();
    const g = c.createRadialGradient(e.p.x, e.p.y, 0, e.p.x, e.p.y, r); g.addColorStop(0, '#9ad060'); g.addColorStop(0.2, '#6aa840'); g.addColorStop(1, '#3a7a34');
    c.globalAlpha = k; c.fillStyle = g; c.beginPath(); c.arc(e.p.x, e.p.y, r, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(200,240,160,0.3)'; c.lineWidth = Math.max(PXW, U); c.beginPath(); for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; c.moveTo(e.p.x, e.p.y); c.lineTo(e.p.x + Math.cos(a) * r, e.p.y + Math.sin(a) * r); } c.stroke();
    c.fillStyle = 'rgba(255,255,255,0.7)'; for (let i = 0; i < 3; i++) { c.beginPath(); c.arc(e.p.x + Math.cos(i * 2) * r * 0.4, e.p.y + Math.sin(i * 2) * r * 0.4, 2 * U, 0, TAU); c.fill(); }   // beads of water
    c.globalAlpha = 1;
  } };
EV.frogchorus = { title: 'A chorus of frogs sings from the pads', w: 1,
  init(e) { if (pads.length < 2) { e.done = true; return; } e.frogs = pads.slice(0, 3).map((p, i) => ({ pad: p, off: { x: (R() - 0.5) * p.r * 0.5, y: (R() - 0.5) * p.r * 0.5 }, a: R() * TAU, z: 0, croak: 0, tongue: 0, timer: 0, state: 'pad', ph: i * 1.3 })); },
  update(e, dt) {
    for (const f of e.frogs) {
      const q = padPos(f.pad); f.x = q.x + f.off.x; f.y = q.y + f.off.y; f.timer += dt;
      f.croak = Math.max(0, Math.sin(e.t * 4 + f.ph)) * (Math.floor((e.t + f.ph) / 1.5) % 2);
      if (f.tongue > 0) { f.tongue += dt * 4; if (f.tongue > 2) f.tongue = 0; }
      for (const b of insectTargets()) { const d = Math.hypot(b.x - f.x, b.y - f.y); if (d < 70 * U && !f.tongue) { f.a = Math.atan2(b.y - f.y, b.x - f.x); f.tongue = 0.01; b.take(); break; } }
    }
    if (e.t > 35) e.done = true;
  },
  draw(e, c, l) { if (l === 'top') for (const f of e.frogs) drawFrog(c, f, false); } };

/* ---------- scheduler ---------- */
let activeEvents = [], eventTimer = 25 + Math.random() * 25, eventSeq = 0, toastT;
const EV_NAMES = Object.keys(EV);
function toastMsg(msg) {
  const el = document.getElementById('toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 3500);
}
function startEvent(name, announce) {
  if (activeEvents.some(e => e.name === name)) return false;
  const grp = EV[name].group;                                // only one darkening-sky event at a time
  if (grp && activeEvents.some(e => EV[e.name].group === grp)) return false;
  const e = { name, t: 0, done: false };
  EV[name].init(e);
  if (e.done) return false;
  activeEvents.push(e);
  if (announce) toastMsg(EV[name].title);
  return true;
}
function randomEvent(announce) {
  for (let tries = 0; tries < 6; tries++) {
    const pool = EV_NAMES.filter(n => !activeEvents.some(e => e.name === n));
    let r = R() * pool.reduce((a, n) => a + EV[n].w, 0);
    for (const n of pool) { r -= EV[n].w; if (r <= 0) { if (startEvent(n, announce)) return n; break; } }
  }
  return null;
}
function nextEvent() {
  for (let i = 0; i < EV_NAMES.length; i++) { const n = EV_NAMES[eventSeq++ % EV_NAMES.length]; if (startEvent(n, true)) return n; }
  return null;
}
function updateEvents(dt) {
  eventTimer -= dt;
  if (eventTimer < 0) { eventTimer = 30 + R() * 45; randomEvent(false); }
  for (const e of activeEvents) { e.t += dt; if (!e.done) EV[e.name].update(e, dt); }
  activeEvents = activeEvents.filter(e => !e.done);
  koiForage();
  for (const p of pads) if (p.wx || p.wy) { p.wx *= Math.pow(0.97, dt); p.wy *= Math.pow(0.97, dt); }
}
function drawEvents(c, layer) { for (const e of activeEvents) if (!e.done && EV[e.name].draw) EV[e.name].draw(e, c, layer); }

/* =====================================================================
   Frame
   ===================================================================== */
function update(dt) {
  const rate = [0, 0.7, 9][rainMode];
  for (let n = rate * dt; n > 0; n -= 1) if (R() < n) addRipple(POND.x0 + R() * (POND.x1 - POND.x0), POND.y0 + R() * (POND.y1 - POND.y0), rainMode === 2 ? 0.3 + R() * 0.2 : 0.4 + R() * 0.3);
  for (const k of koi) k.update(dt);
  for (const k of koi) {                                   // koi near the surface push wakes
    if (k.depth > 0.45) continue;
    const near = 1 - k.depth / 0.45, h = k.head, tl = k.pts[k.N - 1];
    const f = dt * 60;
    poke(h.x + Math.cos(k.heading) * k.L * 0.08, h.y + Math.sin(k.heading) * k.L * 0.08, -2.0 * near * Math.min(2, k.burst) * f);
    poke(tl.x, tl.y, Math.sin(k.phase) * 0.9 * near * f);
  }
  if (R() < dt * 6)                                         // a light breeze now and then
    poke(POND.x0 + R() * (POND.x1 - POND.x0), POND.y0 + R() * (POND.y1 - POND.y0), (R() - 0.5) * 2.5);
  waveAcc += dt;
  const stepT = 1 / (60 * WK);
  for (let n = 0; waveAcc > stepT && n < 4 * WK + 1; n++) { stepWaves(); waveAcc -= stepT; }
  if (waveAcc > stepT) waveAcc = 0;
  for (const p of food) {
    if (p.suckBy) {
      const m = p.suckBy.mouthPos();
      p.x += (m.x - p.x) * Math.min(1, dt * 30); p.y += (m.y - p.y) * Math.min(1, dt * 30);
      p.suck -= dt; if (p.suck <= 0) p.eaten = true;
      continue;
    }
    if (p.bug) { updateBug(p, dt); continue; }
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98;
  }
  bugTimer -= dt;
  if (bugTimer < 0) { dropBug(); bugTimer = 45 + R() * 75; }
  food = food.filter(p => !p.eaten && p.life > 0);
  updateFly(dt);
  updateCat(dt);
  updateGnome(dt);
  updateCapy(dt);
  updateEvents(dt);
  if (koi.filter(k => !k.special).length + (gnome && gnome.fish ? 1 : 0) + activeEvents.filter(e => e.heldKoi).length < koiTarget) {        // a fish the gnome is holding still counts                       // a new koi rises from the deep after a loss
    respawnT -= dt;
    if (respawnT < 0) { const k = new Koi(); k.depth = 1; k.dTarget = 0.5; koi.push(k); respawnT = 8; }
  }
}

function render() {
  // --- underwater layer
  sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.drawImage(floorC, 0, 0);
  sctx.setTransform(S, 0, 0, S, 0, 0);
  drawWeeds(sctx);

  for (const k of koi) k.geo();
  const sk = S / SHADOW_DIV;
  shctx.setTransform(1, 0, 0, 1, 0, 0);
  shctx.clearRect(0, 0, shadow.width, shadow.height);
  shctx.setTransform(sk, 0, 0, sk, 0, 0);
  shctx.fillStyle = '#000';
  for (const k of koi) k.drawShadow(shctx);
  for (const p of pads) { const q = padPos(p); shctx.beginPath(); shctx.arc(q.x + 34 * U, q.y + 46 * U, p.r * 0.95, 0, TAU); shctx.fill(); }
  sctx.globalAlpha = 0.33;
  sctx.drawImage(shadow, 0, 0, W, H);
  sctx.globalAlpha = 1;
  drawEvents(sctx, 'scene');

  fishCtx.setTransform(1, 0, 0, 1, 0, 0);
  fishCtx.clearRect(0, 0, fishC.width, fishC.height);
  fishCtx.setTransform(S, 0, 0, S, 0, 0);
  drawEvents(fishCtx, 'fish');
  const sorted = koi.slice().sort((a, b) => b.depth - a.depth);
  for (const k of sorted) k.draw(fishCtx);

  // --- surface layer
  octx.setTransform(1, 0, 0, 1, 0, 0);
  octx.clearRect(0, 0, ov.width, ov.height);
  octx.setTransform(OS, 0, 0, OS, 0, 0);
  for (const p of food) {
    if (p.bug) continue;
    const r = 3.2 * U * (p.suckBy ? Math.max(0.1, p.suck / 0.15) : 1), fade = Math.min(1, p.life / 2);
    octx.globalAlpha = fade * 0.3; octx.fillStyle = '#000';
    octx.beginPath(); octx.arc(p.x + 3 * U, p.y + 4 * U, r, 0, TAU); octx.fill();
    octx.globalAlpha = fade; octx.fillStyle = '#8a5a2b';
    octx.beginPath(); octx.arc(p.x, p.y, r, 0, TAU); octx.fill();
    octx.fillStyle = '#c99a5e';
    octx.beginPath(); octx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.4, 0, TAU); octx.fill();
  }
  octx.globalAlpha = 1;
  for (const p of pads) {
    const q = padPos(p);
    const gr = p.grow ?? 1;
    octx.drawImage(padShadowSprite, q.x + 6 * U - p.r * 1.25 * gr, q.y + 9 * U - p.r * 1.25 * gr, p.r * 2.5 * gr, p.r * 2.5 * gr);
  }
  for (const p of pads) {
    const q = padPos(p), sp = p.sprite;
    octx.save(); octx.translate(q.x, q.y); octx.rotate(q.rot + (1 - (p.grow ?? 1)) * 2); if (p.grow !== undefined) octx.scale(p.grow, p.grow);
    octx.drawImage(sp.c, -sp.D / 2, -sp.D / 2, sp.D, sp.D);
    if (p.flower) {
      const f = p.flower, bob = 1 + Math.sin(t * 0.8 + p.ph) * 0.02;
      const bl = p.bloom ?? 1;                                // a new flower opens slowly
      octx.translate(p.fx, p.fy); octx.scale(bob * (0.15 + 0.85 * bl), bob * (0.15 + 0.85 * bl)); octx.rotate((1 - bl) * 1.5);
      octx.drawImage(f.c, -f.D / 2, -f.D / 2, f.D, f.D);
    }
    octx.restore();
  }
  for (const p of food) if (p.bug) drawBug(octx, p);
  drawEvents(octx, 'surface');
  octx.drawImage(borderC, 0, 0, W, H);
  drawEvents(octx, 'deck');
  drawCapy(octx);
  drawCat(octx);
  drawGnome(octx);
  drawFly(octx, true);
  drawFly(octx, false);
  drawEvents(octx, 'top');
  present();
}

/* =====================================================================
   Setup, loop, input
   ===================================================================== */
function buildLayout() {                                    // same seed = same pond, whichever view is showing
  const saved = R; R = mulberry32(layoutSeed);
  try { makeBorder(); makeFloor(); makeWeeds(); makePads(); } finally { R = saved; }
}
function setView(pix) {
  pixelMode = pix;
  try { localStorage.setItem('pondView', pix ? 'pixel' : 'smooth'); } catch (e) {}
  resize();
  toastMsg(pix ? 'Pixel view' : 'Smooth view');
  updateStat();
}
function resize() {
  W = innerWidth; H = innerHeight;
  U = Math.min(W, H) / 1000;
  const autoPX = Math.max(1, Math.round(Math.min(W, H) / 450));
  PX = pxOverride || autoPX;                               // css px per art pixel
  GPX = pixelMode ? PX : autoPX;                           // css px per water-simulation cell
  WK = 4 / GPX;                                            // keeps waves the same size on screen at any resolution
  PXW = pixelMode ? PX : 1;
  OS = S = pixelMode ? 1 / PX : Math.min(window.devicePixelRatio || 1, 1.5);
  glc.style.imageRendering = pixelMode ? 'pixelated' : 'auto';
  for (const c of [glc, scene, fishC]) { c.width = Math.ceil(W * S); c.height = Math.ceil(H * S); }
  ov.width = glc.width; ov.height = glc.height;
  for (const c of [glc, ov]) { c.style.width = W + 'px'; c.style.height = H + 'px'; }
  shadow.width = Math.ceil(W * S / SHADOW_DIV); shadow.height = Math.ceil(H * S / SHADOW_DIV);
  if (gl) gl.viewport(0, 0, glc.width, glc.height);
  buildLayout(); makeWaterGrid(); setFilters();
  for (const k of koi) k.clampTo();
}

let last = performance.now(), fpsAcc = 0, frames = 0, fps = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const el = now - last; last = now;
  const dt = Math.min(0.05, el / 1000) * speed;
  t += dt;
  update(dt);
  render();
  frames++; fpsAcc += el;
  if (fpsAcc > 1000) { fps = frames; frames = 0; fpsAcc = 0; updateStat(); }
}
function updateStat() {
  stat.textContent = koi.length + ' koi · rain ' + ['off', 'light', 'heavy'][rainMode] + ' · ' + speed.toFixed(2) + '× · ' +
    fps + ' fps · ' + (pixelMode ? 'pixel view, ' + PX + 'px pixels' : 'smooth view') + (gl ? '' : ' · no WebGL (flat water)');
}

ov.addEventListener('click', e => {
  if (e.clientX < POND.x0 || e.clientX > POND.x1 || e.clientY < POND.y0 || e.clientY > POND.y1) return;
  addRipple(e.clientX, e.clientY, 1);
  for (let i = 0, n = 4 + Math.floor(R() * 4); i < n; i++)
    food.push({ x: e.clientX + (R() - 0.5) * 30 * U, y: e.clientY + (R() - 0.5) * 30 * U,
      vx: (R() - 0.5) * 20 * U, vy: (R() - 0.5) * 20 * U, life: 14 + R() * 8, eaten: false });
});
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') { if (koi.length < 40) { koi.push(new Koi()); koiTarget = koiBase = koi.length; } }
  else if (k === 'x') { koi.pop(); koiTarget = koiBase = koi.length; }
  else if (k === 'c') summonCat();
  else if (k === 'g') summonGnome();
  else if (k === 's') summonCapy();
  else if (k === 'e') randomEvent(true);
  else if (k === 'n') nextEvent();
  else if ((k === '[' || k === ']') && pixelMode) { pxOverride = clamp(PX + (k === ']' ? 1 : -1), 1, 8); resize(); }
  else if (k === 'v') setView(!pixelMode);
  else if (k === 'r') rainMode = (rainMode + 1) % 3;
  else if (k === 'b') dropBug();
  else if (k === 'p') { layoutSeed = Math.floor(Math.random() * 1e9); resize(); }
  else if (k === '+' || k === '=') speed = Math.min(4, speed * 1.25);
  else if (k === '-' || k === '_') speed = Math.max(0.25, speed / 1.25);
  else if (k === 'h') help.classList.toggle('hide');
  else if (k === 'enter') {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); } catch (_) {}
  } else return;
  updateStat();
});
let idleT;
addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500);
});
addEventListener('resize', resize);
setTimeout(() => help.classList.add('hide'), 12000);

initGL();
makeShadowSprite();
resize();
for (let i = 0, n = clamp(Math.round(W * H / 320000), 3, 8); i < n; i++) koi.push(new Koi());
koiTarget = koiBase = koi.length;
updateStat();
requestAnimationFrame(loop);
</script>
</body>
</html>
