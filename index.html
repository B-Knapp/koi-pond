<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Pond</title>
<style>
  html,body{margin:0;height:100%;background:#061615;overflow:hidden}
  canvas{position:fixed;left:0;top:0;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #ov{opacity:0}
  #ov{cursor:crosshair}
  body.idle #ov{cursor:none}
  #help{position:fixed;left:16px;bottom:14px;z-index:5;font:12px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#a9d2c6;background:rgba(3,16,14,.78);padding:10px 14px;border:1px solid rgba(120,190,170,.25);
    border-radius:8px;transition:opacity .8s;user-select:none;backdrop-filter:blur(6px)}
  #help.hide{opacity:0;pointer-events:none}
  #toast{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:6;font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#e6f6ef;background:rgba(3,16,14,.8);padding:7px 14px;border:1px solid rgba(120,190,170,.3);border-radius:20px;opacity:0;transition:opacity .6s;pointer-events:none}
  #toast.show{opacity:1}
  #help b{color:#e6f6ef}
  kbd{font:11px Menlo,monospace;color:#f3c886;background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px}
  #stat{color:#6e9a8e}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="toast"></div>
<div id="help">
  <b>Pixel Pond</b> · procedurally generated, live water simulation<br>
  <kbd>click</kbd> feed the koi · <kbd>F</kbd>/<kbd>X</kbd> add/remove koi · <kbd>R</kbd> rain<br>
  <kbd>B</kbd> drop a bug · <kbd>C</kbd> cat · <kbd>G</kbd> gnome · <kbd>S</kbd> capybara spa · <kbd>E</kbd> random event · <kbd>N</kbd> next event · <kbd>P</kbd> new pond · <kbd>+</kbd>/<kbd>-</kbd> speed · <kbd>Enter</kbd> fullscreen · <kbd>H</kbd> hide<br>
  <kbd>V</kbd> smooth / pixel view · <kbd>[</kbd>/<kbd>]</kbd> pixel size<br>
  <span id="stat"></span>
</div>
<script>
'use strict';
let R = Math.random;                                         // swapped for a seeded one while building the pond layout
const TAU = Math.PI * 2;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let layoutSeed = Math.floor(Math.random() * 1e9);
let pixelMode = true;
try { pixelMode = localStorage.getItem('pondView') !== 'smooth'; } catch (e) {}
const rnd = a => a[Math.floor(R() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

let glc = document.getElementById('gl');
const ov = document.getElementById('ov'), octx = ov.getContext('2d');
const help = document.getElementById('help'), stat = document.getElementById('stat');
const scene = document.createElement('canvas'), sctx = scene.getContext('2d');      // everything under the surface
const shadow = document.createElement('canvas'), shctx = shadow.getContext('2d');  // low-res = free blur
const floorC = document.createElement('canvas'), fctx = floorC.getContext('2d');
const fishC = document.createElement('canvas'), fishCtx = fishC.getContext('2d');
const SHADOW_DIV = 5;

let W, H, U, S, OS;
let t = 0, speed = 1, rainMode = 1;
let B = 80, POND = { x0: 0, y0: 0, x1: 1, y1: 1 }, cat = null, catTimer = 20 + Math.random() * 25, koiTarget = 0, respawnT = 0;
let koi = [], ripples = [], food = [], pads = [], weeds = [], fly = null, flyTimer = 10, bugTimer = 30 + Math.random() * 40;

/* =====================================================================
   WebGL water: refraction + caustics + ripple highlights
   ===================================================================== */
const MAX_RIP = 48;
let gl = null, texs = {}, loc = {}, fallbackCtx = null;

/* Palette: everything on screen is snapped to these colors (with ordered dithering) */
const PALETTE = [
  '#0a0e12', '#121c22', '#1a2a2c', '#0d2628', '#113536', '#164446', '#1d5656', '#276a68', '#357f78', '#4f9b8e',
  '#78baa8', '#a9d8c8', '#e2f4ec',
  '#1b3420', '#28502a', '#386e32', '#4f8c3a', '#6fa846', '#98c65a', '#c4e07c',
  '#2e261c', '#4a3a28', '#6a5236', '#8c6e48', '#b08e60', '#d4b688', '#5e4a36', '#7a6650', '#96826a', '#7e6044', '#a08060',
  '#3e1812', '#6a2418', '#93301f', '#bf3f28', '#e0642c', '#f0943c', '#f6c25a', '#fbe79a',
  '#f6f1e6', '#cfc8ba', '#a0978a', '#726b62', '#4a4540', '#2a282c',
  '#d8609a', '#f3a6c8', '#1c4a74', '#2d86c8', '#86cdec', '#5a3a6a'
];
const NP = PALETTE.length;
const palFloats = new Float32Array(NP * 3);
PALETTE.forEach((h, i) => { for (let k = 0; k < 3; k++) palFloats[i * 3 + k] = parseInt(h.substr(1 + k * 2, 2), 16) / 255; });

const FRAG = `
#define NP ${NP}
uniform sampler2D uScene, uFish, uOver, uHeight;
uniform vec2 uRes;
uniform float uTime, uPx, uU, uK, uPix, uScale, uGpx;
uniform vec2 uGrid;
uniform vec3 uPal[NP];

float caustic(vec2 uv, float time) {
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p;
  float c = 1.0, inten = 0.005;
  for (int n = 0; n < 5; n++) {
    float tt = time * (1.0 - (3.5 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 5.0;
  c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 1.0);
}
float bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float hgt(vec2 uv) { return (texture2D(uHeight, uv).r - 0.50196) * 255.0 / 24.0; }
float nmax(sampler2D s, vec2 uv, vec2 px) {
  return max(max(texture2D(s, uv + vec2(px.x, 0.0)).a, texture2D(s, uv - vec2(px.x, 0.0)).a),
             max(texture2D(s, uv + vec2(0.0, px.y)).a, texture2D(s, uv - vec2(0.0, px.y)).a));
}

void main() {
  vec2 px = 1.0 / uRes;
  vec2 uv = gl_FragCoord.xy * px;
  float t = uTime;

  // slope of the simulated water surface
  vec2 g = vec2(hgt(uv + vec2(uGrid.x, 0.0)) - hgt(uv - vec2(uGrid.x, 0.0)),
                hgt(uv + vec2(0.0, uGrid.y)) - hgt(uv - vec2(0.0, uGrid.y))) * uK;
  vec2 q = gl_FragCoord.xy * uPx / uU;
  vec2 amb = vec2(cos(q.x * 0.021 + t * 0.9 + q.y * 0.007), cos(q.y * 0.026 - t * 0.7 + q.x * 0.004));
  vec2 ruv = uv + (clamp(g * 1.1, -1.6, 1.6) + amb * 0.35) * uK * uGpx * uScale * px;

  // underwater: floor + koi, bent by the waves
  vec3 col = texture2D(uScene, ruv).rgb;
  vec4 f = texture2D(uFish, ruv);
  if (uPix < 0.5) col = mix(col, f.rgb, f.a);                                       // smooth view
  else if (f.a >= 0.2) col = mix(col, f.rgb, max(0.35, floor(f.a * 4.0 + 0.5) / 4.0));
  else { float n = nmax(uFish, ruv, px); if (n >= 0.2) col *= mix(1.0, 0.45, n); }   // outline

  float c = caustic(q / 620.0 + amb * 0.004 + g * 0.01, t * 0.32);
  col += vec3(0.50, 0.72, 0.66) * c * 0.22;
  vec3 nrm = normalize(vec3(-(g * 0.45 + amb * 0.03), 1.0));
  vec3 L = normalize(vec3(-0.35, 0.5, 1.0));
  float spec = pow(clamp((dot(nrm, L) - L.z) / (1.0 - L.z), 0.0, 1.0), 1.4);
  col += vec3(0.85, 0.95, 1.0) * spec * 0.75;
  col = mix(col, vec3(0.02, 0.11, 0.115), 0.14);

  // surface layer: pads, wall, cat, bugs, dragonfly (crisp, outlined)
  vec4 o = texture2D(uOver, uv);
  float dz = 0.075;
  if (uPix < 0.5) col = mix(col, o.rgb, o.a);
  else if (o.a >= 0.5) { col = o.rgb; dz = 0.022; }
  else {
    col = mix(col, o.rgb, o.a);
    if (nmax(uOver, uv, px) >= 0.5) col *= 0.42;
  }
  float vig = smoothstep(1.2, 0.4, length((uv - 0.5) * vec2(1.15, 1.0)) * 1.4);
  col *= mix(0.75, 1.0, vig);

  if (uPix < 0.5) { gl_FragColor = vec4(col, 1.0); return; }
  // ordered dither + snap to palette
  col += (bayer4(gl_FragCoord.xy) - 0.5) * dz;
  vec3 best = uPal[0]; float bd = 1e9;
  for (int i = 0; i < NP; i++) {
    vec3 d = col - uPal[i];
    float e = dot(d * d, vec3(2.0, 4.0, 3.0));
    if (e < bd) { bd = e; best = uPal[i]; }
  }
  gl_FragColor = vec4(best, 1.0);
}`;

function useFallback() {
  const c = document.createElement('canvas');
  c.id = 'gl'; glc.replaceWith(c); glc = c;
  gl = null; fallbackCtx = c.getContext('2d');
}

function initGL() {
  try { gl = glc.getContext('webgl', { alpha: false, antialias: false }); } catch (e) { gl = null; }
  if (!gl) { useFallback(); return; }
  const hp = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
  const prec = hp && hp.precision > 0 ? 'precision highp float;\n' : 'precision mediump float;\n';
  const sh = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
    return s;
  };
  const vs = sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.0,1.0);}');
  const fs = sh(gl.FRAGMENT_SHADER, prec + FRAG);
  if (!vs || !fs) { useFallback(); return; }
  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); useFallback(); return; }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  ['uScene', 'uFish', 'uOver', 'uHeight'].forEach((n, i) => {
    const tx = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + i);
    gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    texs[n] = { tx, unit: i };
    gl.uniform1i(gl.getUniformLocation(prog, n), i);
  });
  for (const n of ['uRes', 'uTime', 'uPx', 'uU', 'uK', 'uPal', 'uPix', 'uScale', 'uGpx', 'uGrid']) loc[n] = gl.getUniformLocation(prog, n);
  gl.uniform3fv(loc.uPal, palFloats);
}

function setFilters() {
  if (!gl) return;
  const f = pixelMode ? gl.NEAREST : gl.LINEAR;
  for (const n in texs) {
    gl.activeTexture(gl.TEXTURE0 + texs[n].unit); gl.bindTexture(gl.TEXTURE_2D, texs[n].tx);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  }
}
function upload(name, src) {
  const tx = texs[name];
  gl.activeTexture(gl.TEXTURE0 + tx.unit);
  gl.bindTexture(gl.TEXTURE_2D, tx.tx);
  if (src instanceof Uint8Array) gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, gw, gh, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, src);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
}

function present() {
  if (gl) {
    for (let i = 0; i < hCur.length; i++) { const v = 128 + hCur[i] * 24; hByte[i] = v < 0 ? 0 : v > 255 ? 255 : v; }
    upload('uScene', scene); upload('uFish', fishC); upload('uOver', ov); upload('uHeight', hByte);
    gl.uniform2f(loc.uRes, glc.width, glc.height);
    gl.uniform1f(loc.uTime, t);
    gl.uniform1f(loc.uPx, 1 / S);
    gl.uniform1f(loc.uPix, pixelMode ? 1 : 0);
    gl.uniform1f(loc.uScale, S);
    gl.uniform1f(loc.uGpx, GPX);
    gl.uniform2f(loc.uGrid, 1 / gw, 1 / gh);
    gl.uniform1f(loc.uU, U);
    gl.uniform1f(loc.uK, WK);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  } else {
    fallbackCtx.setTransform(1, 0, 0, 1, 0, 0);
    fallbackCtx.drawImage(scene, 0, 0); fallbackCtx.drawImage(fishC, 0, 0); fallbackCtx.drawImage(ov, 0, 0);
  }
}

/* =====================================================================
   Water simulation: a height field, one cell per pixel
   ===================================================================== */
let pxOverride = 0, WK = 1, PX = 4, GPX = 4, PXW = 4, gw = 1, gh = 1, hCur = new Float32Array(1), hPrev = new Float32Array(1), hByte = new Uint8Array(1), damp = new Float32Array(1), waveAcc = 0;

function makeWaterGrid() {
  makePokeKernel();
  gw = Math.ceil(W / GPX); gh = Math.ceil(H / GPX);
  hCur = new Float32Array(gw * gh); hPrev = new Float32Array(gw * gh);
  hByte = new Uint8Array(gw * gh); damp = new Float32Array(gw * gh);
  const x0 = Math.ceil(POND.x0 / GPX), x1 = Math.floor(POND.x1 / GPX), y0 = Math.ceil(POND.y0 / GPX), y1 = Math.floor(POND.y1 / GPX);
  for (let y = Math.max(1, y0); y < Math.min(gh - 1, y1); y++)
    for (let x = Math.max(1, x0); x < Math.min(gw - 1, x1); x++) damp[y * gw + x] = Math.pow(0.986, 1 / WK);
  for (const p of pads) {                                   // lily pads calm the water beneath them
    const r = p.r / GPX * 0.9, cx = p.x / GPX, cy = p.y / GPX;
    for (let y = Math.floor(cy - r); y <= cy + r; y++) for (let x = Math.floor(cx - r); x <= cx + r; x++) {
      if (x < 1 || y < 1 || x >= gw - 1 || y >= gh - 1) continue;
      const i = y * gw + x;
      if (damp[i] && Math.hypot(x - cx, y - cy) < r) damp[i] = Math.pow(0.9, 1 / WK);
    }
  }
}

function stepWaves() {
  const w = gw, a = hCur, b = hPrev;
  for (let y = 1; y < gh - 1; y++) {
    let i = y * w + 1;
    for (let x = 1; x < w - 1; x++, i++) {
      const d = damp[i];
      b[i] = d ? ((a[i - 1] + a[i + 1] + a[i - w] + a[i + w]) * 0.5 - b[i]) * d : 0;
    }
  }
  hPrev = a; hCur = b;
}

let pokeK = [];                                             // soft gaussian brush, sized to the pixel scale
function makePokeKernel() {
  pokeK = [];
  const r = Math.max(1, Math.round(1.6 * WK)), sig = 0.75 * WK;
  let sum = 0;
  for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) {
    const w = Math.exp(-(x * x + y * y) / (2 * sig * sig)); pokeK.push([x, y, w]); sum += w;
  }
  for (const k of pokeK) k[2] /= sum;
}
function poke(x, y, amt) {
  const gx = Math.round(x / GPX), gy = Math.round(y / GPX), r = Math.ceil(1.6 * WK) + 1;
  if (gx < r || gy < r || gx >= gw - r || gy >= gh - r) return;
  const i = gy * gw + gx;
  for (const [dx, dy, w] of pokeK) hCur[i + dy * gw + dx] += amt * w;
}

function splash(x, y, s) {
  const gx = x / GPX, gy = y / GPX, r = (1.2 + s * 2.4) * WK, amp = 5 * s;
  for (let yy = Math.floor(gy - r); yy <= gy + r; yy++) for (let xx = Math.floor(gx - r); xx <= gx + r; xx++) {
    if (xx < 1 || yy < 1 || xx >= gw - 1 || yy >= gh - 1) continue;
    const d = Math.hypot(xx - gx, yy - gy);
    if (d < r) hCur[yy * gw + xx] -= amp * (1 - d / r);
  }
}

/* =====================================================================
   Pond floor & weeds
   ===================================================================== */
function makeFloor() {
  floorC.width = scene.width; floorC.height = scene.height;
  const f = fctx;
  f.setTransform(S, 0, 0, S, 0, 0);
  const g = f.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
  g.addColorStop(0, '#0e3332'); g.addColorStop(0.6, '#173b34'); g.addColorStop(1, '#2c3d2b');
  f.fillStyle = g; f.fillRect(0, 0, W, H);

  for (let i = 0; i < 70; i++) {                       // mottling
    const x = R() * W, y = R() * H, r = (80 + R() * 260) * U;
    const gg = f.createRadialGradient(x, y, 0, x, y, r);
    const dark = R() < 0.55;
    gg.addColorStop(0, dark ? 'rgba(4,18,16,0.22)' : 'rgba(70,90,60,0.12)');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    f.fillStyle = gg; f.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const stones = ['#4a4a3c', '#5b5141', '#3e4a44', '#6a604c', '#2f3a35', '#545a4c'];
  const n = Math.round(W * H / 1400);
  for (let i = 0; i < n; i++) {                        // pebbles, denser near edges
    const x = R() * W, y = R() * H;
    const e = Math.max(Math.abs(x / W - 0.5), Math.abs(y / H - 0.5)) * 2;
    if (R() > 0.25 + e * e * 0.9) continue;
    const r = (2 + Math.pow(R(), 2.2) * 14) * U, rot = R() * TAU;
    f.globalAlpha = 0.18 + R() * 0.25;
    f.fillStyle = rnd(stones);
    f.beginPath();
    for (let k = 0; k < 7; k++) {                      // irregular stone outline
      const a = rot + k / 7 * TAU, rr = r * (0.7 + R() * 0.35);
      const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr * 0.75;
      k ? f.lineTo(px, py) : f.moveTo(px, py);
    }
    f.closePath(); f.fill();
  }
  f.globalAlpha = 0.25;
  for (let i = 0; i < W * H / 300; i++) {               // sand speckle
    f.fillStyle = R() < 0.5 ? '#0a1d1a' : '#3b4a3c';
    f.fillRect(R() * W, R() * H, U * 1.2, U * 1.2);
  }
  f.globalAlpha = 1;
}

function makeWeeds() {
  weeds = [];
  const n = 5 + Math.floor(R() * 4);
  for (let i = 0; i < n; i++) {
    const edge = R() < 0.7;
    let x = R() * W, y = R() * H;
    if (edge) { if (R() < 0.5) x = R() < 0.5 ? B + R() * 90 * U : W - B - R() * 90 * U; else y = R() < 0.5 ? B + R() * 90 * U : H - B - R() * 90 * U; }
    const toC = Math.atan2(H / 2 - y, W / 2 - x);
    const strands = [];
    for (let k = 0, m = 6 + Math.floor(R() * 8); k < m; k++)
      strands.push({ ang: toC + (R() - 0.5) * 2.2, len: (40 + R() * 110) * U, w: (2 + R() * 3) * U, ph: R() * TAU,
        col: rnd(['rgba(38,92,48,0.75)', 'rgba(52,108,52,0.7)', 'rgba(30,74,44,0.8)', 'rgba(70,112,50,0.6)']) });
    weeds.push({ x, y, strands });
  }
}

function drawWeeds(c) {
  c.lineCap = 'round';
  for (const wd of weeds) for (const s of wd.strands) {
    const sw = Math.sin(t * 0.6 + s.ph), sw2 = Math.sin(t * 0.6 + s.ph + 1.2);
    const a1 = s.ang + sw2 * 0.25, a2 = s.ang + sw * 0.18;
    const cx = wd.x + Math.cos(a1) * s.len * 0.5, cy = wd.y + Math.sin(a1) * s.len * 0.5;
    const ex = wd.x + Math.cos(a2) * s.len, ey = wd.y + Math.sin(a2) * s.len;
    c.strokeStyle = s.col; c.lineWidth = s.w;
    c.beginPath(); c.moveTo(wd.x, wd.y); c.quadraticCurveTo(cx, cy, ex, ey); c.stroke();
  }
}

/* =====================================================================
   Koi
   ===================================================================== */
const CW = {
  kohaku:   { base: '#f3eee4', patches: ['#d6402a'], fin: 'rgba(246,240,232,0.85)' },
  sanke:    { base: '#f3eee4', patches: ['#d6402a', '#d6402a', '#1e1e24'], fin: 'rgba(246,240,232,0.85)' },
  showa:    { base: '#24242a', patches: ['#d6402a', '#f3eee4'], fin: 'rgba(60,60,66,0.85)' },

    const a = 0.25 + (TAU - 0.5) * i / 14 + (R() - 0.5) * 0.08;

    x.fillStyle = R() < 0.5 ? 'rgba(200,190,90,0.18)' : 'rgba(20,50,20,0.2)';

  }
  x.strokeStyle = 'rgba(230,255,200,0.25)'; x.lineWidth = r * 0.05;
  x.beginPath(); x.arc(0, 0, r * 0.97, 3.6, 5.2); x.stroke();
  x.restore();
  shape(); x.strokeStyle = 'rgba(18,55,22,0.7)'; x.lineWidth = Math.max(1, r * 0.03); x.stroke();
  return { c, D };
}

function flowerSprite(f) {
  const D = Math.ceil(f * 2.6), c = document.createElement('canvas');
  c.width = c.height = Math.ceil(D * OS);
  const x = c.getContext('2d'); x.scale(OS, OS); x.translate(D / 2, D / 2);
  const pink = R() < 0.6;
  const petal = (len, wid, rot, c0, c1) => {
    x.save(); x.rotate(rot);
    const g = x.createLinearGradient(0, 0, 0, -len);
    g.addColorStop(0, c0); g.addColorStop(1, c1);
    x.fillStyle = g;
    x.beginPath(); x.moveTo(0, 0);
    x.quadraticCurveTo(wid, -len * 0.5, 0, -len);
    x.quadraticCurveTo(-wid, -len * 0.5, 0, 0);
    x.fill();
    x.strokeStyle = 'rgba(120,40,70,0.15)'; x.lineWidth = 0.6; x.stroke();
    x.restore();
  };
  x.shadowColor = 'rgba(0,0,0,0.35)'; x.shadowBlur = f * 0.25 * OS; x.shadowOffsetX = f * 0.08 * OS; x.shadowOffsetY = f * 0.12 * OS;
  for (let i = 0; i < 10; i++) petal(f, f * 0.34, i / 10 * TAU, pink ? '#e2659c' : '#f2e6d8', pink ? '#ffe2ee' : '#ffffff');
  x.shadowColor = 'transparent';
  for (let i = 0; i < 8; i++) petal(f * 0.72, f * 0.28, (i + 0.5) / 8 * TAU, pink ? '#ee86b2' : '#f6efe4', pink ? '#fff0f6' : '#ffffff');
  const g = x.createRadialGradient(0, 0, 0, 0, 0, f * 0.2);
  g.addColorStop(0, '#fff3a0'); g.addColorStop(1, '#e8b830');
  x.fillStyle = g; x.beginPath(); x.arc(0, 0, f * 0.2, 0, TAU); x.fill();
  x.fillStyle = '#f7c844';
  for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; x.beginPath(); x.arc(Math.cos(a) * f * 0.24, Math.sin(a) * f * 0.24, f * 0.035, 0, TAU); x.fill(); }
  return { c, D };
}

function makePads() {
  pads = [];
  const n = clamp(Math.round(W * H / 380000), 3, 6);
  const clusters = [];
  for (let i = 0, k = 2 + Math.floor(R() * 2); i < k; i++) clusters.push({ x: W * (0.12 + R() * 0.76), y: H * (0.12 + R() * 0.76) });
  let tries = 0;
  while (pads.length < n && tries++ < 800) {
    const r = (38 + R() * 48) * U, c = rnd(clusters);
    const x = c.x + (R() - 0.5) * 380 * U, y = c.y + (R() - 0.5) * 260 * U;
    if (x < POND.x0 + r || x > POND.x1 - r || y < POND.y0 + r || y > POND.y1 - r) continue;
    if (pads.some(p => Math.hypot(p.x - x, p.y - y) < (p.r + r) * 0.95)) continue;
    const pad = { x, y, r, rot: R() * TAU, ph: R() * 100, sprite: padSprite(r) };
    if (R() < 0.35) { pad.flower = flowerSprite(r * 0.42); pad.fx = (R() - 0.5) * r * 0.5; pad.fy = (R() - 0.5) * r * 0.5; }
    pads.push(pad);
  }
}

function padPos(p) {
  const wx = clamp(p.wx || 0, -40 * U, 40 * U), wy = clamp(p.wy || 0, -40 * U, 40 * U);     // pushed by wind gusts
  return { x: p.x + Math.sin(t * 0.06 + p.ph) * 6 * U + wx, y: p.y + Math.cos(t * 0.045 + p.ph) * 4 * U + wy, rot: p.rot + Math.sin(t * 0.05 + p.ph) * 0.15 };
}

/* =====================================================================
   Ripples, food, dragonfly, rain
   ===================================================================== */
function addRipple(x, y, s = 1) { splash(x, y, s); }

function updateFly(dt) {
  if (!fly) {
    flyTimer -= dt;
    if (flyTimer < 0) {
      const left = R() < 0.5;
      fly = { x: left ? -40 * U : W + 40 * U, y: H * (0.1 + R() * 0.8), a: left ? 0 : Math.PI, wp: null, hops: 3 + Math.floor(R() * 4), pause: 0, leaving: false };
      fly.wp = { x: W * (0.1 + R() * 0.8), y: H * (0.1 + R() * 0.8) };
    }
    return;
  }
  if (fly.pause > 0) { fly.pause -= dt; return; }
  const dx = fly.wp.x - fly.x, dy = fly.wp.y - fly.y, d = Math.hypot(dx, dy);
  if (d < 10 * U) {
    fly.legT = 0;
    if (fly.leaving) { fly = null; flyTimer = 20 + R() * 40; return; }
    if (--fly.hops <= 0) { fly.leaving = true; fly.wp = { x: fly.x < W / 2 ? -80 * U : W + 80 * U, y: fly.y + (R() - 0.5) * 200 * U }; }
    else { fly.pause = 0.8 + R() * 2.2; if (R() < 0.6) addRipple(fly.x, fly.y, 0.45); fly.wp = { x: W * (0.1 + R() * 0.8), y: H * (0.1 + R() * 0.8) }; }
    return;
  }
  fly.legT = (fly.legT || 0) + dt;
  const off = angDiff(fly.a, Math.atan2(dy, dx));
  fly.a += off * Math.min(1, dt * 8);
  // slow down when facing away or close, so the target can't sit inside the turning circle
  const sp = 260 * U * Math.max(0.12, Math.cos(off)) * Math.min(1, 0.25 + d / (90 * U));
  const step = Math.min(sp * dt, d);
  fly.x += Math.cos(fly.a) * step; fly.y += Math.sin(fly.a) * step;
  if (fly.legT > 6) { fly.wp = { x: fly.x, y: fly.y }; }     // safety: never chase one point forever
}

function drawFly(c, shadowPass) {
  if (!fly) return;
  const s = U * 1.1;
  c.save();
  if (shadowPass) { c.translate(fly.x + 40 * U, fly.y + 55 * U); c.globalAlpha = 0.16; }
  else c.translate(fly.x, fly.y);
  c.rotate(fly.a);
  const flick = (fly.pause > 0 ? 0.04 : 0.18) * Math.sin(performance.now() * 0.09);
  const wing = (x, ang, len) => {
    c.save(); c.translate(x * s, 0); c.rotate(ang);
    c.beginPath(); c.ellipse(len * s * 0.5, 0, len * s * 0.5, 4.5 * s, 0, 0, TAU);
    c.fillStyle = shadowPass ? '#000' : 'rgba(220,240,255,0.28)'; c.fill();
    if (!shadowPass) { c.strokeStyle = 'rgba(255,255,255,0.45)'; c.lineWidth = 0.7; c.stroke(); }
    c.restore();
  };
  for (const sd of [1, -1]) { wing(-2, sd * (1.45 + flick), 24); wing(-8, sd * (1.75 - flick), 22); }
  const g = shadowPass ? '#000' : c.createLinearGradient(0, 0, -40 * s, 0);
  if (!shadowPass) { g.addColorStop(0, '#1d6fa5'); g.addColorStop(0.5, '#2b9bd0'); g.addColorStop(1, '#13324a'); }
  c.strokeStyle = g; c.lineCap = 'round';
  c.lineWidth = 3.2 * s; c.beginPath(); c.moveTo(-6 * s, 0); c.lineTo(-40 * s, 0); c.stroke();
  c.fillStyle = shadowPass ? '#000' : '#1f5f86';
  c.beginPath(); c.ellipse(-3 * s, 0, 5 * s, 3.2 * s, 0, 0, TAU); c.fill();
  c.fillStyle = shadowPass ? '#000' : '#5cc7e8';
  c.beginPath(); c.arc(3 * s, -1.8 * s, 2 * s, 0, TAU); c.arc(3 * s, 1.8 * s, 2 * s, 0, TAU); c.fill();
  c.restore();
}


/* =====================================================================
   Bugs that fall in the water (the koi treat them as food)
   ===================================================================== */
const BUG_TYPES = { ladybug: 16, beetle: 22, fly: 15, moth: 25 };
const FALL_TIME = 0.75;

function dropBug(x, y) {
  for (let tries = 0; tries < 25 && x === undefined; tries++) {
    const cx = POND.x0 + 30 * U + R() * (POND.x1 - POND.x0 - 60 * U), cy = POND.y0 + 30 * U + R() * (POND.y1 - POND.y0 - 60 * U);
    if (pads.every(pd => { const q = padPos(pd); return Math.hypot(q.x - cx, q.y - cy) > pd.r + 18 * U; })) { x = cx; y = cy; }
  }
  if (x === undefined) return;
  const type = rnd(Object.keys(BUG_TYPES));
  food.push({ bug: type, x, y, vx: (R() - 0.5) * 6 * U, vy: (R() - 0.5) * 6 * U, size: BUG_TYPES[type] * U,
    rot: R() * TAU, fall: FALL_TIME, life: 50 + R() * 30, tw: 0.3, active: 0, eaten: false, seed: R() * 100 });
}

function updateBug(p, dt) {
  if (p.fall > 0) {
    p.fall -= dt;
    if (p.fall <= 0) { addRipple(p.x, p.y, 0.9); p.active = 0.8; }
    return;
  }
  p.life -= dt;
  p.x += p.vx * dt; p.y += p.vy * dt;
  p.vx *= Math.pow(0.7, dt); p.vy *= Math.pow(0.7, dt);
  p.tw -= dt; p.active -= dt;
  if (p.tw < 0 && p.life > 3) {                     // a struggle: twitch, spin a little, make a small ripple
    p.tw = 0.5 + R() * 1.6;
    p.active = 0.25 + R() * 0.4;
    p.rot += (R() - 0.5) * 0.7;
    p.vx += (R() - 0.5) * 10 * U; p.vy += (R() - 0.5) * 10 * U;
    addRipple(p.x, p.y, 0.18 + R() * 0.12);
  }
}

function drawBug(c, p) {
  const k = p.fall > 0 ? p.fall / FALL_TIME : 0;    // 1 = high in the air, 0 = on the water
  const fade = Math.min(1, p.life / 3), sz = p.size * (p.suckBy ? Math.max(0.1, p.suck / 0.15) : 1);
  const now = performance.now() / 1000;
  const busy = p.active > 0 || k > 0;
  const wig = Math.sin(now * (busy ? 38 : 4) + p.seed) * (busy ? 1 : 0.25);

  // shadow on the water grows sharper as it falls
  c.globalAlpha = fade * (0.12 + (1 - k) * 0.22); c.fillStyle = '#000';
  c.beginPath(); c.ellipse(p.x + 3 * U, p.y + 4 * U, sz * (0.8 + k * 0.4), sz * (0.55 + k * 0.3), p.rot, 0, TAU); c.fill();

  c.save();
  c.translate(p.x - k * 45 * U, p.y - k * 65 * U);
  c.rotate(p.rot + (k > 0 ? Math.sin(now * 9 + p.seed) * 0.6 : 0));
  const sc = 1 + k * 0.9; c.scale(sc, sc);
  c.globalAlpha = fade;

  // legs
  c.strokeStyle = 'rgba(20,16,12,0.9)'; c.lineWidth = Math.max(0.8, sz * 0.07); c.lineCap = 'round';
  for (const side of [1, -1]) for (let i = -1; i <= 1; i++) {
    const bx = i * sz * 0.28, by = side * sz * 0.22;
    const ex = i * sz * 0.5 + wig * sz * 0.12 * (i === 0 ? -1 : 1), ey = side * sz * (0.72 + 0.08 * Math.abs(i));
    c.beginPath(); c.moveTo(bx, by); c.quadraticCurveTo(bx + (ex - bx) * 0.3, ey * 0.85, ex, ey); c.stroke();
  }

  const flutter = busy ? Math.sin(now * 55 + p.seed) * 0.35 : 0;
  if (p.bug === 'ladybug') {
    const g = c.createRadialGradient(-sz * 0.15, -sz * 0.15, 0, 0, 0, sz * 0.6);
    g.addColorStop(0, '#ff5a3c'); g.addColorStop(1, '#a8160e');
    c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, sz * 0.58, sz * 0.5, 0, 0, TAU); c.fill();
    c.strokeStyle = '#111'; c.lineWidth = sz * 0.06;
    c.beginPath(); c.moveTo(sz * 0.4, 0); c.lineTo(-sz * 0.58, 0); c.stroke();
    c.fillStyle = '#111';
    for (const [sx, sy, sr] of [[0.15, 0.22, 0.11], [0.15, -0.22, 0.11], [-0.2, 0.28, 0.1], [-0.2, -0.28, 0.1], [-0.38, 0.12, 0.08], [-0.38, -0.12, 0.08]]) {
      c.beginPath(); c.arc(sx * sz, sy * sz, sr * sz, 0, TAU); c.fill();
    }
    c.beginPath(); c.ellipse(sz * 0.5, 0, sz * 0.2, sz * 0.27, 0, 0, TAU); c.fill();
    c.fillStyle = '#f4f0e8';
    c.beginPath(); c.arc(sz * 0.55, sz * 0.12, sz * 0.05, 0, TAU); c.arc(sz * 0.55, -sz * 0.12, sz * 0.05, 0, TAU); c.fill();
  } else if (p.bug === 'beetle') {
    const g = c.createLinearGradient(0, -sz * 0.4, 0, sz * 0.4);
    g.addColorStop(0, '#2f8a6e'); g.addColorStop(0.5, '#123e3a'); g.addColorStop(1, '#2a4f8a');
    c.fillStyle = g; c.beginPath(); c.ellipse(-sz * 0.12, 0, sz * 0.6, sz * 0.38, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(0,0,0,0.6)'; c.lineWidth = sz * 0.04;
    c.beginPath(); c.moveTo(sz * 0.3, 0); c.lineTo(-sz * 0.72, 0); c.stroke();
    c.fillStyle = '#163c36'; c.beginPath(); c.ellipse(sz * 0.42, 0, sz * 0.18, sz * 0.26, 0, 0, TAU); c.fill();
    c.fillStyle = '#0b1c1a'; c.beginPath(); c.ellipse(sz * 0.62, 0, sz * 0.1, sz * 0.14, 0, 0, TAU); c.fill();
    c.strokeStyle = 'rgba(170,255,220,0.35)'; c.lineWidth = sz * 0.05;
    c.beginPath(); c.ellipse(-sz * 0.15, -sz * 0.15, sz * 0.35, sz * 0.08, -0.1, Math.PI * 1.1, Math.PI * 1.8); c.stroke();
  } else if (p.bug === 'fly') {
    c.fillStyle = 'rgba(215,230,240,0.35)'; c.strokeStyle = 'rgba(255,255,255,0.5)'; c.lineWidth = 0.6;
    for (const side of [1, -1]) {
      c.save(); c.rotate(side * (2.55 + flutter));
      c.beginPath(); c.ellipse(sz * 0.42, 0, sz * 0.45, sz * 0.17, 0, 0, TAU); c.fill(); c.stroke();
      c.restore();
    }
    c.fillStyle = '#3a3a3e'; c.beginPath(); c.ellipse(-sz * 0.15, 0, sz * 0.42, sz * 0.24, 0, 0, TAU); c.fill();
    c.fillStyle = '#2a2a2e'; c.beginPath(); c.ellipse(sz * 0.2, 0, sz * 0.2, sz * 0.2, 0, 0, TAU); c.fill();
    c.fillStyle = '#8c2a1e';
    c.beginPath(); c.arc(sz * 0.38, sz * 0.12, sz * 0.11, 0, TAU); c.arc(sz * 0.38, -sz * 0.12, sz * 0.11, 0, TAU); c.fill();
  } else if (p.bug === 'hopper') {
    c.fillStyle = '#7a9a3a'; c.beginPath(); c.ellipse(0, 0, sz * 0.7, sz * 0.22, 0, 0, TAU); c.fill();
    c.fillStyle = '#6a8a30'; c.beginPath(); c.ellipse(sz * 0.6, 0, sz * 0.22, sz * 0.2, 0, 0, TAU); c.fill();
    c.strokeStyle = '#5a7a2a'; c.lineWidth = Math.max(PXW, sz * 0.08);
    for (const sd of [1, -1]) { c.beginPath(); c.moveTo(0, sd * sz * 0.1); c.lineTo(-sz * 0.4, sd * sz * 0.45); c.lineTo(-sz * 0.9, sd * sz * 0.2); c.stroke(); }
  } else if (p.bug === 'cicada') {
    c.fillStyle = 'rgba(220,235,240,0.55)'; for (const sd of [1, -1]) { c.beginPath(); c.ellipse(-sz * 0.2, sd * sz * 0.35, sz * 0.7, sz * 0.25, sd * 0.3, 0, TAU); c.fill(); }
    c.fillStyle = '#4a4030'; c.beginPath(); c.ellipse(0, 0, sz * 0.55, sz * 0.3, 0, 0, TAU); c.fill();
    c.fillStyle = '#2a6a3a'; c.beginPath(); c.ellipse(sz * 0.45, 0, sz * 0.22, sz * 0.32, 0, 0, TAU); c.fill();
  } else if (p.bug === 'caterpillar') {
    for (let i = 0; i < 6; i++) { c.fillStyle = i % 2 ? '#7ab038' : '#8ac848'; c.beginPath(); c.arc((i - 2.5) * sz * 0.22, Math.sin(i + t * 3) * sz * 0.06, sz * 0.16, 0, TAU); c.fill(); }
  } else {                                                  // moth, flat on the water
    for (const side of [1, -1]) {
      c.save(); c.rotate(side * (1.95 + flutter * 0.5));
      const g = c.createLinearGradient(0, 0, sz * 0.9, 0);
      g.addColorStop(0, '#8a6f4f'); g.addColorStop(1, '#c4ad88');
      c.fillStyle = g;
      c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(sz * 0.5, -sz * 0.45, sz * 0.95, -sz * 0.1);
      c.quadraticCurveTo(sz * 0.7, sz * 0.25, 0, sz * 0.05); c.fill();
      c.fillStyle = 'rgba(70,50,30,0.55)';
      c.beginPath(); c.arc(sz * 0.55, -sz * 0.08, sz * 0.09, 0, TAU); c.fill();
      c.restore();
    }
    c.fillStyle = '#6b5236'; c.beginPath(); c.ellipse(-sz * 0.08, 0, sz * 0.38, sz * 0.13, 0, 0, TAU); c.fill();
    c.fillStyle = '#4e3a24'; c.beginPath(); c.arc(sz * 0.32, 0, sz * 0.11, 0, TAU); c.fill();
    c.strokeStyle = '#5a4630'; c.lineWidth = Math.max(0.6, sz * 0.04);
    for (const side of [1, -1]) { c.beginPath(); c.moveTo(sz * 0.38, 0); c.quadraticCurveTo(sz * 0.6, side * sz * 0.1, sz * 0.7, side * sz * 0.3); c.stroke(); }
  }
  c.restore();
  c.globalAlpha = 1;
}


/* =====================================================================
   Brick border (pre-rendered once per resize)
   ===================================================================== */
const borderC = document.createElement('canvas');

function rrect(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) c.roundRect(x, y, w, h, r); else c.rect(x, y, w, h);
}

function drawCourses(c, len) {
  // local frame: x runs along the edge, y = 0 is the water's edge, negative y goes outward
  const gap = Math.max(2.2 * U, PXW);
  const capH = 22 * U;
  let x = -40 * U;
  while (x < len + 40 * U) {                             // coping stones along the water
    const w = (60 + R() * 35) * U;
    const g = c.createLinearGradient(0, -capH, 0, 0);
    const base = rnd(['#a39a8b', '#968d7f', '#aca395', '#8c8476']);
    g.addColorStop(0, base); g.addColorStop(0.75, base); g.addColorStop(1, '#6e665b');
    c.fillStyle = g; rrect(c, x, -capH, w - gap, capH, 3 * U); c.fill();
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fillRect(x + 2 * U, -capH + 2 * U, w - gap - 4 * U, 2 * U);
    for (let i = 0; i < 6; i++) {
      c.fillStyle = R() < 0.5 ? 'rgba(0,0,0,0.12)' : 'rgba(255,255,255,0.08)';
      c.beginPath(); c.arc(x + R() * (w - gap), -capH + R() * capH, (0.6 + R() * 1.4) * U, 0, TAU); c.fill();
    }
    x += w;
  }
  c.fillStyle = 'rgba(0,0,0,0.35)'; c.fillRect(-50 * U, -2 * U, len + 100 * U, 2 * U);   // wet lip

  const bh = 22 * U, bl = 52 * U, bg = Math.max(3.4 * U, PXW), reds = ['#8e3b2a', '#a14a33', '#7d3425', '#b05a3c', '#93452f', '#9a5236', '#7a3a2c'];
  const joints = [];
  for (let row = 0, y = -capH - gap; y > -B - 2 * bh; row++, y -= bh) {
    for (let bx = -bl - (row % 2) * bl / 2; bx < len + bl; bx += bl) {
      const top = y - bh + bg, w = bl - bg, h = bh - bg;
      c.fillStyle = rnd(reds); rrect(c, bx, top, w, h, 2 * U); c.fill();
      c.fillStyle = 'rgba(255,220,190,0.08)'; c.fillRect(bx + 2 * U, top + 1.2 * U, w - 4 * U, 2 * U);
      c.fillStyle = 'rgba(0,0,0,0.12)'; c.fillRect(bx + 2 * U, top + h - 2.2 * U, w - 4 * U, 1.6 * U);
      for (let i = 0; i < 7; i++) {
        c.fillStyle = R() < 0.6 ? 'rgba(40,10,5,0.25)' : 'rgba(255,200,160,0.12)';
        c.fillRect(bx + R() * w, top + R() * h, U * 1.4, U * 1.4);
      }
      joints.push({ x: bx - bg / 2, y: top + R() * h, along: 'v' });        // vertical joint beside the brick
      joints.push({ x: bx + R() * w, y: top - bg / 2, along: 'h' });        // horizontal joint above it
    }
  }
  // grass growing out of the mortar joints
  const greens = ['#5f8f3a', '#6fa043', '#4d7a30', '#82b04e', '#3f6a2a', '#93b85a'];
  for (let i = 0, n = Math.round(len / (22 * U)); i < n; i++) {
    const j = rnd(joints);
    if (j.y < -B - bh) { i--; continue; }
    const blades = 5 + Math.floor(R() * 10), spread = (j.along === 'h' ? 9 : 4) * U;
    c.fillStyle = 'rgba(20,30,10,0.25)';
    c.beginPath(); c.ellipse(j.x + 1.5 * U, j.y + 2 * U, spread * 0.9 + 3 * U, 3 * U, j.along === 'h' ? 0 : Math.PI / 2, 0, TAU); c.fill();
    c.lineCap = 'round';
    for (let b = 0; b < blades; b++) {
      const off = (R() - 0.5) * 2 * spread;
      const bx = j.along === 'h' ? j.x + off : j.x, by = j.along === 'h' ? j.y : j.y + off;
      const a = R() * TAU, L = (8 + R() * 14) * U, bend = (R() - 0.5) * 1.2;
      c.strokeStyle = rnd(greens); c.lineWidth = PXW;
      c.beginPath(); c.moveTo(bx, by);
      c.quadraticCurveTo(bx + Math.cos(a) * L * 0.5, by + Math.sin(a) * L * 0.5,
        bx + Math.cos(a + bend) * L, by + Math.sin(a + bend) * L);
      c.stroke();
    }
  }
  for (let i = 0; i < len / (90 * U); i++) {               // moss
    const mx = R() * len, my = -R() * (capH + 10 * U), n = 6 + Math.floor(R() * 14);
    for (let k = 0; k < n; k++) {
      c.fillStyle = rnd(['rgba(70,110,40,0.55)', 'rgba(95,135,50,0.5)', 'rgba(50,85,35,0.6)']);
      c.beginPath(); c.arc(mx + (R() - 0.5) * 14 * U, my + (R() - 0.5) * 8 * U, (0.8 + R() * 2) * U, 0, TAU); c.fill();
    }
  }
}


function drawDeck(c, len) {
  // local frame: x runs along the edge, y = 0 is the water's edge, negative y goes outward
  const gapW = Math.max(2 * U, PXW), fasc = 11 * U, pw = 25 * U, joist = 72 * U, dot = Math.max(1.8 * U, PXW);
  const woods = ['#8a6a48', '#7a5c3e', '#9a7a55', '#6e5238', '#a3845e', '#85664a', '#7d6b57', '#94806a'];
  c.fillStyle = '#5a4430'; c.fillRect(-80 * U, -fasc, len + 160 * U, fasc);           // edge board over the water
  c.fillStyle = 'rgba(255,230,190,0.14)'; c.fillRect(-80 * U, -fasc, len + 160 * U, 2 * U);
  c.fillStyle = 'rgba(0,0,0,0.4)'; c.fillRect(-80 * U, -2 * U, len + 160 * U, 2 * U);
  for (let y = -fasc - gapW; y > -B - pw * 2; y -= pw) {
    let x = -80 * U - R() * 220 * U;
    while (x < len + 80 * U) {
      const L = (170 + R() * 230) * U, w = L - gapW, top = y - pw + gapW, h = pw - gapW;
      c.fillStyle = rnd(woods); c.fillRect(x, top, w, h);
      c.lineWidth = Math.max(0.9 * U, PXW);
      for (let g = 0; g < 4; g++) {                                                    // grain
        let gy = top + (0.15 + R() * 0.7) * h;
        c.strokeStyle = R() < 0.6 ? 'rgba(40,25,10,0.3)' : 'rgba(255,230,190,0.14)';
        c.beginPath(); c.moveTo(x, gy);
        for (let sx = x + 30 * U; sx < x + w + 30 * U; sx += 30 * U) {
          gy = clamp(gy + (R() - 0.5) * 2.5 * U, top + 1.5 * U, top + h - 1.5 * U);
          c.lineTo(Math.min(sx, x + w), gy);
        }
        c.stroke();
      }
      if (R() < 0.5) {                                                                 // knot
        const kx = x + 10 * U + R() * (w - 20 * U), ky = top + h * (0.3 + R() * 0.4);
        c.fillStyle = 'rgba(50,30,15,0.55)'; c.beginPath(); c.ellipse(kx, ky, 4.5 * U, 2.4 * U, 0, 0, TAU); c.fill();
        c.strokeStyle = 'rgba(50,30,15,0.35)'; c.beginPath(); c.ellipse(kx, ky, 8 * U, 4.2 * U, 0, 0, TAU); c.stroke();
      }
      if (R() < 0.45) { c.fillStyle = 'rgba(210,205,190,0.1)'; c.fillRect(x + R() * w * 0.5, top, w * (0.2 + R() * 0.3), h); }  // sun-bleached
      c.fillStyle = 'rgba(255,235,200,0.12)'; c.fillRect(x, top, w, 1.5 * U);
      c.fillStyle = 'rgba(0,0,0,0.2)'; c.fillRect(x, top + h - 1.5 * U, w, 1.5 * U);
      c.fillStyle = 'rgba(28,22,16,0.75)';                                              // nails over the joists
      for (let jx = Math.ceil((x + 4 * U) / joist) * joist; jx < x + w - 4 * U; jx += joist) {
        c.fillRect(jx - dot / 2, top + h * 0.28 - dot / 2, dot, dot);
        c.fillRect(jx - dot / 2, top + h * 0.72 - dot / 2, dot, dot);
      }
      x += L;
    }
  }
}

function makeBorder() {
  B = Math.round(108 * U);
  POND = { x0: B, y0: B, x1: W - B, y1: H - B };
  borderC.width = Math.round(W * OS); borderC.height = Math.round(H * OS);
  const c = borderC.getContext('2d');
  c.setTransform(OS, 0, 0, OS, 0, 0);
  c.clearRect(0, 0, W, H);
  c.save();                                                // shadow the wall casts onto the water
  c.shadowColor = 'rgba(0,0,0,0.65)'; c.shadowBlur = 22 * U * OS; c.shadowOffsetX = 8 * U * OS; c.shadowOffsetY = 11 * U * OS;
  c.beginPath(); c.rect(-300, -300, W + 600, H + 600); c.rect(B, B, W - 2 * B, H - 2 * B);
  c.fillStyle = '#5c5249'; c.fill('evenodd');
  c.restore();
  const sides = [
    { poly: [[0, 0], [W, 0], [W - B, B], [B, B]], tx: 0, ty: B, rot: 0, len: W },
    { poly: [[W, H], [0, H], [B, H - B], [W - B, H - B]], tx: W, ty: H - B, rot: Math.PI, len: W },
    { poly: [[0, H], [0, 0], [B, B], [B, H - B]], tx: B, ty: H, rot: -Math.PI / 2, len: H },
    { poly: [[W, 0], [W, H], [W - B, H - B], [W - B, B]], tx: W - B, ty: 0, rot: Math.PI / 2, len: H }
  ];
  for (const sd of sides) {
    c.save();
    c.beginPath(); sd.poly.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.closePath(); c.clip();
    c.fillStyle = '#1e160e'; c.fillRect(0, 0, W, H);       // dark gaps between boards
    c.translate(sd.tx, sd.ty); c.rotate(sd.rot);
    drawDeck(c, sd.len);
    c.restore();
  }
  c.strokeStyle = 'rgba(20,14,8,0.85)'; c.lineWidth = Math.max(2 * U, PXW);   // mitre seams at the corners
  for (const [a, b2] of [[[0, 0], [B, B]], [[W, 0], [W - B, B]], [[0, H], [B, H - B]], [[W, H], [W - B, H - B]]]) {
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b2[0], b2[1]); c.stroke();
  }
}

/* =====================================================================
   The cat: walks in, sits on the wall, watches, swipes, sometimes wins
   ===================================================================== */
const CAT_COATS = [
  { base: '#d98a3d', stripe: 'rgba(140,70,20,0.55)', eye: '#8fcf4a' },                 // orange tabby
  { base: '#8d8a86', stripe: 'rgba(55,53,51,0.55)', eye: '#d8c34e' },                  // grey tabby
  { base: '#262529', stripe: null, eye: '#e6c24a' },                                    // black
  { base: '#29282d', stripe: null, eye: '#9ad86e', tux: '#f2efe8' },                   // tuxedo
  { base: '#ece5da', stripe: null, eye: '#6fb4e8', patch: '#c9864a' }                  // white with ginger patches
];
const CAT_REACH = 140;

function summonCat() {
  if (anyVisitor()) { catTimer = 20; return; }
  const side = Math.floor(R() * 4), f = 0.18 + R() * 0.64, inset = B - 10 * U;
  let x, y, a;
  if (side === 0) { x = W * f; y = inset; a = Math.PI / 2; }
  else if (side === 1) { x = W * f; y = H - inset; a = -Math.PI / 2; }
  else if (side === 2) { x = inset; y = H * f; a = 0; }
  else { x = W - inset; y = H * f; a = Math.PI; }
  const back = B + 160 * U;
  const ox = x - Math.cos(a) * back, oy = y - Math.sin(a) * back;
  cat = { x: ox, y: oy, sx: x, sy: y, ox, oy, face: a, a, coat: rnd(CAT_COATS), state: 'arrive', timer: 0,
    walk: 0, head: 0, headT: 0, tail: R() * TAU, attempts: 0, sw: 0, reachT: 0, target: null, tp: null, caught: null, lean: 0 };
}

const catS = () => U * 1.75;
function catLean() {
  if (!cat) return 0;
  if (cat.state === 'swipe') return Math.sin(Math.min(1, cat.sw) * Math.PI) * 8;
  if (cat.state === 'crouch') return -3;
  return 0;
}
function catLocalToWorld(lx, ly) {
  const c = Math.cos(cat.a), s = Math.sin(cat.a);
  return { x: cat.x + lx * c - ly * s, y: cat.y + lx * s + ly * c };
}
function catMouth() {
  const s = catS(), l = catLean();
  return catLocalToWorld((8 + l) * s + Math.cos(cat.head) * 22 * s, Math.sin(cat.head) * 22 * s);
}
function catPawOrigin() { return catLocalToWorld(14 * catS(), 0); }

function startLeave() { cat.state = 'turn'; cat.timer = 0; }

function moveCatTo(tx, ty, dt) {
  const dx = tx - cat.x, dy = ty - cat.y, d = Math.hypot(dx, dy), step = Math.min(d, 80 * U * dt);
  if (d > 0.01) { cat.x += dx / d * step; cat.y += dy / d * step; }
  cat.walk += dt * 9;
  return d < 1;
}

function resolveSwipe() {
  const tp = cat.tp, k = cat.target;
  addRipple(tp.x, tp.y, 1.3);
  if (k && koi.includes(k)) {
    let d = 1e9;
    for (let i = 0; i < k.N / 2; i++) d = Math.min(d, Math.hypot(k.pts[i].x - tp.x, k.pts[i].y - tp.y));
    const chance = 0.36 - k.depth * 0.5;                                   // shallow fish are easier
    if (d < 45 * U && R() < chance) {
      koi.splice(koi.indexOf(k), 1);
      cat.caught = k; k.depth = 0; k.mouth = 0; k.gulp = 0;
      respawnT = 35 + R() * 30;
      for (const f of food) if (f.suckBy === k) f.eaten = true;
      return;
    }
  }
  for (const f of koi) {                                                   // a miss scatters everyone nearby
    const d = Math.hypot(f.head.x - tp.x, f.head.y - tp.y);
    if (d < 320 * U) {
      f.heading = Math.atan2(f.head.y - tp.y, f.head.x - tp.x);
      f.burst = 3.2; f.dTarget = 0.9; f.dTimer = 6 + R() * 4;
    }
  }
}

function updateCat(dt) {
  if (!cat) { catTimer -= dt; if (catTimer < 0) summonCat(); return; }
  const watching = cat.state === 'watch' && cat.reachT > 0;
  cat.tail += dt * (watching || cat.state === 'crouch' ? 6 : 1.6);
  if (cat.caught) cat.caught.phase += dt * 14;                             // fish thrashes in its mouth

  // head tracks the nearest koi
  if (cat.state === 'watch' || cat.state === 'crouch' || cat.state === 'swipe') {
    let look = cat.state === 'watch' ? null : cat.target, ld = 450 * U;
    if (!look) for (const k of koi) { const d = Math.hypot(k.head.x - cat.x, k.head.y - cat.y); if (d < ld) { ld = d; look = k; } }
    cat.headT = look ? clamp(angDiff(cat.a, Math.atan2(look.head.y - cat.y, look.head.x - cat.x)), -0.8, 0.8) : Math.sin(t * 0.3) * 0.3;
  } else cat.headT = 0;
  cat.head += (cat.headT - cat.head) * Math.min(1, dt * 5);

  switch (cat.state) {
    case 'arrive':
      if (moveCatTo(cat.sx, cat.sy, dt)) { cat.state = 'watch'; cat.timer = 0; }
      break;
    case 'watch': {
      cat.timer += dt;
      const o = catPawOrigin();
      let best = null, bd = CAT_REACH * U;
      for (const k of koi) {
        if (k.depth > 0.6 || k.L > 150 * U) continue;                       // too deep, or too big to carry
        const d = Math.hypot(k.head.x - o.x, k.head.y - o.y);
        if (d < bd) { bd = d; best = k; }
      }
      if (best) { cat.reachT += dt; if (cat.reachT > 0.45) { cat.state = 'crouch'; cat.timer = 0; cat.target = best; } }
      else cat.reachT = Math.max(0, cat.reachT - dt);
      // now and then a curious koi drifts over to see if the cat means food
      cat.lureT = (cat.lureT ?? 2) - dt;
      if (cat.lureT < 0) {
        cat.lureT = 3 + R() * 5;
        const near = koi.filter(k => !(k.lureT > 0) && Math.hypot(k.head.x - o.x, k.head.y - o.y) < 600 * U);
        if (near.length) { const k = rnd(near); k.lureT = 6; k.lure = o; }
      }
      if (cat.timer > 40) startLeave();
      break;
    }
    case 'crouch':
      cat.timer += dt;
      if (cat.timer > 0.55) {
        const k = cat.target;
        if (!koi.includes(k)) { cat.state = 'watch'; cat.reachT = 0; break; }
        const o = catPawOrigin();
        let tx = k.head.x + Math.cos(k.heading) * k.cruise * 0.25, ty = k.head.y + Math.sin(k.heading) * k.cruise * 0.25;
        const d = Math.hypot(tx - o.x, ty - o.y), mx = (CAT_REACH + 15) * U;
        if (d > mx) { tx = o.x + (tx - o.x) / d * mx; ty = o.y + (ty - o.y) / d * mx; }
        cat.tp = { x: tx, y: ty }; cat.state = 'swipe'; cat.sw = 0; cat.resolved = false;
      }
      break;
    case 'swipe':
      cat.sw += dt / 0.45;
      if (!cat.resolved && cat.sw >= 0.42) { cat.resolved = true; resolveSwipe(); }
      if (cat.sw >= 1) {
        cat.attempts++; cat.reachT = 0; cat.target = null;
        if (cat.caught) { cat.state = 'gloat'; cat.timer = 0; }
        else if (cat.attempts >= 3) startLeave();
        else { cat.state = 'watch'; cat.timer = Math.min(cat.timer, 15); }
      }
      break;
    case 'gloat':
      cat.timer += dt; if (cat.timer > 1.1) startLeave();
      break;
    case 'turn': {
      const goal = cat.face + Math.PI;
      const dA = angDiff(cat.a, goal);
      cat.a += Math.sign(dA) * Math.min(Math.abs(dA), dt * 3.5);
      cat.walk += dt * 5;
      if (Math.abs(dA) < 0.02) { cat.a = goal; cat.state = 'leave'; }
      break;
    }
    case 'leave':
      if (moveCatTo(cat.ox, cat.oy, dt)) { cat = null; catTimer = 45 + R() * 75; }
      break;
  }
}

function holdCaughtFish() {
  const k = cat.caught, s = catS();
  let mx, my;
  const m = catMouth();
  if (cat.state === 'swipe') {                                             // dragged from the water to the mouth
    const e = clamp((cat.sw - 0.42) / 0.58, 0, 1);
    mx = cat.tp.x + (m.x - cat.tp.x) * e; my = cat.tp.y + (m.y - cat.tp.y) * e;
  } else { mx = m.x; my = m.y; }
  const bodyA = cat.a + cat.head + Math.PI / 2 + 0.5;
  for (let i = 0; i < k.N; i++) {
    const a = bodyA + Math.sin(k.phase + i * 0.45) * 0.35 * (i / k.N);
    const prev = i ? k.pts[i - 1] : null;
    k.pts[i].x = i ? prev.x + Math.cos(a) * k.seg : mx;
    k.pts[i].y = i ? prev.y + Math.sin(a) * k.seg : my;
  }
  k.heading = bodyA + Math.PI;
}

function drawCat(c) {
  if (!cat) return;
  const s = catS(), co = cat.coat, lean = catLean();
  const walking = cat.state === 'arrive' || cat.state === 'leave' || cat.state === 'turn';
  const wig = cat.state === 'crouch' ? Math.sin(cat.timer * 38) * 2 : 0;
  const pawCol = co.tux || co.base;

  // shadow
  c.save(); c.translate(cat.x + 9 * U, cat.y + 12 * U); c.rotate(cat.a);
  c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(-18 * s, 0, (walking ? 46 : 36) * s, 21 * s, 0, 0, TAU); c.fill();
  c.restore();

  c.save(); c.translate(cat.x, cat.y); c.rotate(cat.a); c.translate(lean * s, 0);
  c.lineCap = 'round';
  // tail
  const tw = Math.sin(cat.tail);
  c.strokeStyle = co.base; c.lineWidth = 7 * s;
  c.beginPath();
  if (walking) { c.moveTo(-44 * s, 0); c.quadraticCurveTo(-64 * s, tw * 14 * s, -84 * s, (tw * 6 - 6) * s); }
  else { c.moveTo(-40 * s, 6 * s); c.bezierCurveTo(-54 * s, 24 * s, -30 * s, 36 * s, (-6 + tw * 7) * s, (30 + tw * 5) * s); }
  c.stroke();
  if (co.stripe) {
    c.strokeStyle = co.stripe; c.lineWidth = 7 * s; c.setLineDash([3 * s, 4 * s]);
    c.stroke(); c.setLineDash([]);
  }

  // paws
  c.fillStyle = pawCol;
  const swipeSide = cat.state === 'swipe' && cat.tp ? (toCatLocal(cat.tp).y >= 0 ? 1 : -1) : 0;
  if (walking) {
    for (const [x, sd, ph] of [[10, 1, 0], [10, -1, Math.PI], [-34, 1, Math.PI], [-34, -1, 0]]) {
      const px = x + Math.sin(cat.walk + ph) * 7;
      c.beginPath(); c.ellipse(px * s, sd * 13 * s, 6 * s, 4.5 * s, 0, 0, TAU); c.fill();
    }
  } else {
    for (const sd of [1, -1]) {
      if (sd !== swipeSide) { c.beginPath(); c.ellipse(13 * s, sd * 8 * s, 6 * s, 4.5 * s, 0, 0, TAU); c.fill(); }
      c.fillStyle = co.base; c.beginPath(); c.ellipse(-30 * s, sd * 21 * s, 8 * s, 5 * s, 0.3 * sd, 0, TAU); c.fill();
      c.fillStyle = pawCol;
    }
  }

  // body
  c.save();
  c.beginPath();
  if (walking) { c.ellipse(-28 * s, 0, 20 * s, 15 * s, 0, 0, TAU); c.ellipse(-4 * s, 0, 24 * s, 14 * s, 0, 0, TAU); }
  else { c.ellipse(-24 * s, wig * s, 23 * s, 21 * s, 0, 0, TAU); c.ellipse(-3 * s, 0, 20 * s, 15 * s, 0, 0, TAU); }
  c.fillStyle = co.base; c.fill();
  c.clip();
  if (co.stripe) {
    c.strokeStyle = co.stripe; c.lineWidth = 3.2 * s;
    for (let i = 0; i < 7; i++) {
      const x = -46 + i * 7.5;
      c.beginPath(); c.moveTo(x * s, -24 * s); c.quadraticCurveTo((x + 5) * s, 0, x * s, 24 * s); c.stroke();
    }
    c.lineWidth = 5 * s; c.beginPath(); c.moveTo(-46 * s, 0); c.lineTo(4 * s, 0); c.stroke();
  }
  if (co.patch) {
    c.fillStyle = co.patch;
    c.beginPath(); c.ellipse(-30 * s, -8 * s, 13 * s, 10 * s, 0.4, 0, TAU); c.ellipse(-8 * s, 9 * s, 8 * s, 6 * s, 0, 0, TAU); c.fill();
  }
  if (co.tux) { c.fillStyle = co.tux; c.beginPath(); c.ellipse(9 * s, 0, 9 * s, 10 * s, 0, 0, TAU); c.fill(); }
  c.fillStyle = 'rgba(255,255,255,0.08)'; c.beginPath(); c.ellipse(-18 * s, -6 * s, 24 * s, 7 * s, 0, 0, TAU); c.fill();
  c.restore();

  // the swiping leg
  if (swipeSide) {
    const ext = cat.sw < 0.42 ? cat.sw / 0.42 : Math.max(0, 1 - (cat.sw - 0.42) / 0.58);
    const tl = toCatLocal(cat.tp), sh = { x: 8 * s, y: swipeSide * 9 * s };
    const ex = sh.x + (tl.x - sh.x) * ext, ey = sh.y + (tl.y - sh.y) * ext;
    c.strokeStyle = co.base; c.lineWidth = 8.5 * s;
    c.beginPath(); c.moveTo(sh.x, sh.y); c.lineTo(ex, ey); c.stroke();
    if (co.tux) { c.strokeStyle = co.tux; c.lineWidth = 8 * s; c.beginPath(); c.moveTo(sh.x + (ex - sh.x) * 0.55, sh.y + (ey - sh.y) * 0.55); c.lineTo(ex, ey); c.stroke(); }
    const pa = Math.atan2(ey - sh.y, ex - sh.x);
    c.save(); c.translate(ex, ey); c.rotate(pa);
    c.fillStyle = pawCol; c.beginPath(); c.ellipse(1 * s, 0, 7 * s, 6 * s, 0, 0, TAU); c.fill();
    if (ext > 0.45) {
      c.strokeStyle = 'rgba(250,250,245,0.95)'; c.lineWidth = 1.2 * s;
      for (const cy of [-4, 0, 4]) { c.beginPath(); c.moveTo(6 * s, cy * s); c.lineTo(11 * s, cy * 1.2 * s); c.stroke(); }
    }
    c.restore();
  }
  c.restore();

  if (cat.caught) { holdCaughtFish(); cat.caught.geo(); cat.caught.draw(c); }

  // head
  c.save(); c.translate(cat.x, cat.y); c.rotate(cat.a); c.translate((lean + 8) * s, 0); c.rotate(cat.head);
  for (const sd of [1, -1]) {
    c.fillStyle = co.base;
    c.beginPath(); c.moveTo(3 * s, sd * 8 * s); c.lineTo(13 * s, sd * 11 * s); c.lineTo(1 * s, sd * 19 * s); c.closePath(); c.fill();
    c.fillStyle = 'rgba(230,150,150,0.75)';
    c.beginPath(); c.moveTo(5 * s, sd * 10 * s); c.lineTo(10 * s, sd * 11.5 * s); c.lineTo(3 * s, sd * 16 * s); c.closePath(); c.fill();
  }
  c.fillStyle = co.base; c.beginPath(); c.arc(10 * s, 0, 13 * s, 0, TAU); c.fill();
  if (co.stripe) {
    c.strokeStyle = co.stripe; c.lineWidth = 2.2 * s;
    for (const y of [-4, 0, 4]) { c.beginPath(); c.moveTo(-1 * s, y * s); c.lineTo(8 * s, y * 0.6 * s); c.stroke(); }
  }
  if (co.tux) { c.fillStyle = co.tux; c.beginPath(); c.ellipse(18 * s, 0, 6 * s, 7 * s, 0, 0, TAU); c.fill(); }
  if (co.patch) { c.fillStyle = co.patch; c.beginPath(); c.ellipse(4 * s, -5 * s, 7 * s, 6 * s, 0, 0, TAU); c.fill(); }
  const intent = cat.state === 'watch' && cat.reachT > 0 || cat.state === 'crouch' || cat.state === 'swipe';
  for (const sd of [1, -1]) {
    c.fillStyle = co.eye; c.beginPath(); c.ellipse(17 * s, sd * 5.5 * s, 2.4 * s, 2.8 * s, 0, 0, TAU); c.fill();
    c.fillStyle = '#111'; c.beginPath(); c.ellipse(17.6 * s, sd * 5.5 * s, (intent ? 1.6 : 0.6) * s, 2.3 * s, 0, 0, TAU); c.fill();
  }
  c.fillStyle = '#d98c8c'; c.beginPath(); c.moveTo(23.5 * s, 0); c.lineTo(21 * s, -2 * s); c.lineTo(21 * s, 2 * s); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.6)'; c.lineWidth = 0.7 * s;
  for (const sd of [1, -1]) for (const k of [0, 1, 2]) {
    c.beginPath(); c.moveTo(20 * s, sd * 4 * s); c.lineTo(31 * s, sd * (6 + k * 4) * s); c.stroke();
  }
  c.restore();
}

function toCatLocal(p) {

/* =====================================================================

const anyVisitor = () => cat || gnome || capy;

/* =====================================================================
   The garden gnome (rare): casts a line, waits for a bite, catch & release
   ===================================================================== */
let gnome = null, gnomeTimer = 120 + Math.random() * 150;
const gS = () => U * 2.6;

function summonGnome() {
  if (anyVisitor()) { gnomeTimer = 20; return; }

  gnome = { x: sp.ox, y: sp.oy, sx: sp.x, sy: sp.y, ox: sp.ox, oy: sp.oy, face: sp.a, a: sp.a, state: 'arrive', timer: 0, walk: 0,

    g.bob = null;
  } else {

function updateGnome(dt) {
  if (!gnome) { if (!anyVisitor()) { gnomeTimer -= dt; if (gnomeTimer < 0) summonGnome(); } return; }

    f.k = Math.min(1, f.k + dt / dur);
    f.x = f.fx + (f.tx - f.fx) * f.k; f.y = f.fy + (f.ty - f.fy) * f.k; f.h = Math.sin(Math.PI * f.k) * arc;

}

function drawBobber(c, x, y, sc) {

  c.fillStyle = '#f1c49b';

/* =====================================================================
   The capybara (rare): towel on head, takes a long soak in the pond
   ===================================================================== */
let capy = null, capyTimer = 200 + Math.random() * 200, yuzu = [];
const cS = () => U * 2.7;

function summonCapy() {
  if (anyVisitor()) { capyTimer = 20; return; }
  const sp = edgeSpot(B - 30 * U);
  capy = { x: sp.ox, y: sp.oy, sx: sp.x, sy: sp.y, ox: sp.ox, oy: sp.oy, face: sp.a, a: sp.a, state: 'arrive', timer: 0, walk: 0,
    sub: 0, head: 0, headT: 0, soakT: 45 + R() * 30, damped: null, cx: 0, cy: 0, nextLook: 4 };
  capy.wx = sp.x + Math.cos(sp.a) * 165 * U; capy.wy = sp.y + Math.sin(sp.a) * 165 * U;
}

    const s = cS(), list = [];
    const c = capyBodyCenter(), hd = l2w(capy, 16 * s, 0);
    for (const [ox, oy, rx, ry] of [[c.x, c.y, 28 * s, 17 * s], [hd.x, hd.y, 14 * s, 10 * s]]) {
      const r = Math.max(rx, ry) / GPX + 1, gx = ox / GPX, gy = oy / GPX, ca = Math.cos(-capy.a), sa = Math.sin(-capy.a);
      for (let y = Math.floor(gy - r); y <= gy + r; y++) for (let x = Math.floor(gx - r); x <= gx + r; x++) {
        if (x < 1 || y < 1 || x >= gw - 1 || y >= gh - 1) continue;
        const dx = (x - gx) * GPX, dy = (y - gy) * GPX, lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
        if ((lx * lx) / (rx * rx) + (ly * ly) / (ry * ry) > 1) continue;
        const i = y * gw + x;
        if (damp[i]) { list.push([i, damp[i]]); damp[i] = 0; }
      }
    }
    capy.damped = list;
  } else if (capy.damped) {
    for (const [i, v] of capy.damped) damp[i] = v;
    capy.damped = null;
  }
}

function updateCapy(dt) {
  for (const y of yuzu) {
    y.ph += dt; y.x += Math.cos(y.drift) * 2 * U * dt; y.y += Math.sin(y.drift) * 2 * U * dt;
    if (y.fade) y.alpha = Math.max(0, y.alpha - dt * 0.5);
    if (R() < dt * 0.3) poke(y.x, y.y, 0.4);
  }
  yuzu = yuzu.filter(y => y.alpha > 0);
  if (!capy) { if (!anyVisitor()) { capyTimer -= dt; if (capyTimer < 0) summonCapy(); } return; }
  const c = capy;
  const bc = capyBodyCenter(); c.cx = bc.x; c.cy = bc.y;
  c.head += (c.headT - c.head) * Math.min(1, dt * 1.5);
  const ease = k => k * k * (3 - 2 * k);
  switch (c.state) {
    case 'arrive':
      c.walk += dt * 7;
      if (moveObj(c, c.sx, c.sy, dt, 45 * U)) { c.state = 'enter'; c.timer = 0; }
      break;
    case 'enter': {
      c.timer += dt; const k = Math.min(1, c.timer / 1.8), e = ease(k);
      c.x = c.sx + (c.wx - c.sx) * e; c.y = c.sy + (c.wy - c.sy) * e; c.sub = e; c.walk += dt * 5;
      if (k > 0.55 && !c.splashed) { c.splashed = true; const f = l2w(c, 20 * cS(), 0); splash(f.x, f.y, 1.8); }
      if (k >= 1) {
        const m = l2w(c, -10 * cS(), 0);
        splash(m.x, m.y, 1.4);
        setCapyDamp(true);
        for (let i = 0; i < 3; i++) {
          const a = c.a + (i - 1) * 0.9 + (R() - 0.5) * 0.4, d = (105 + R() * 40) * U, h = l2w(c, -5 * U, 0);
          yuzu.push({ x: h.x + Math.cos(a) * d, y: h.y + Math.sin(a) * d, ph: R() * 6, drift: R() * TAU, alpha: 1, fade: false, r: (9.5 + R() * 2.5) * U });
        }
        c.state = 'soak'; c.timer = 0;
      }
      break;
    }
    case 'soak':
      c.timer += dt; c.nextLook -= dt;
      if (c.nextLook < 0) { c.nextLook = 4 + R() * 5; c.headT = (R() - 0.5) * 0.7; }
      if (R() < dt * 0.35) { const sd = R() < 0.5 ? 1 : -1, p = l2w(c, -14 * cS() + (R() - 0.5) * 30 * U, sd * 19 * cS()); poke(p.x, p.y, -1.2); }
      if (c.timer > c.soakT) { c.state = 'exit'; c.timer = 0; c.headT = 0; setCapyDamp(false); splash(c.cx, c.cy, 0.9); for (const y of yuzu) y.fade = true; }
      break;
    case 'exit': {
      c.timer += dt; const k = Math.min(1, c.timer / 2.0), e = ease(k);
      c.x = c.wx + (c.sx - c.wx) * e; c.y = c.wy + (c.sy - c.wy) * e; c.sub = 1 - e; c.walk += dt * 5;
      if (R() < dt * 10 * (1 - k)) { const p = l2w(c, (R() - 0.7) * 50 * U, (R() - 0.5) * 40 * U); poke(p.x, p.y, -1); }   // drips
      if (k >= 1) { c.state = 'turn'; c.sub = 0; }
      break;
    }
    case 'turn':
      if (turnAround(c, dt)) c.state = 'leave';
      break;
    case 'leave':
      c.walk += dt * 7;
      if (moveObj(c, c.ox, c.oy, dt, 45 * U)) { capy = null; capyTimer = 240 + R() * 300; }
      break;
  }
}

function drawCapy(c) {
  for (const y of yuzu) {
    const bob = Math.sin(y.ph * 2) * 0.6 * U;
    c.globalAlpha = y.alpha;
    c.fillStyle = 'rgba(0,0,0,0.25)'; c.beginPath(); c.arc(y.x + 2 * U, y.y + 3 * U, y.r, 0, TAU); c.fill();

function birdWithShadow(c, x, y, a, s, o, z, alpha = 0.18) {

function mkFloater(title, w, opts, drawFn) {                 // something floating on the surface
  return { title, w,
    init(e) {
      const p = pondPt(70 * U);
      Object.assign(e, { x: p.x, y: p.y, a: R() * TAU, va: (R() - 0.5) * (opts.spin ?? 0.4), drift: R() * TAU, sp: (opts.sp || 8) * U, life: opts.life || 45, fade: 1, dropT: opts.drop ? 0.7 : 0 });
    },
    update(e, dt) {

  c.restore(); fn();
}
function mkWalker(title, w, sp, drawFn, opts = {}) {

/* =====================================================================
   Ecosystem: who eats whom
   ===================================================================== */
function preyOf(kind) {                                       // events offer prey: 'insect', 'fish' (small fish), 'koifood'

function mkFlyover(title, w, o) {
  const sp = (o.speed || 120);
  return { title, w,
    init(e) {
      Object.assign(e, crossPath((o.n > 1 ? 350 : 200) * U)); e.ph = 0; e.birds = [];
      for (let i = 0; i < (o.n || 1); i++) {
        let bx = 0, by = 0;
        if (o.form === 'v') { const row = Math.ceil(i / 2), sd = i % 2 ? 1 : -1; bx = -row * 34 * U * (o.gap || 1); by = i ? sd * row * 26 * U * (o.gap || 1) : 0; }
        else if (o.form === 'line') bx = -i * 40 * U * (o.gap || 1);
        else if (i) { bx = (R() - 0.5) * 240 * U * (o.gap || 1); by = (R() - 0.5) * 240 * U * (o.gap || 1); }
        e.birds.push({ bx, by, ph: R() * TAU, j: R() * TAU });
      }
      if (o.circle) { e.cc = pondPt(220 * U); e.mode = 'in'; e.ang = 0; }
    },
    update(e, dt) {
      e.ph += dt * (o.flapRate || 4);
      if (o.circle) {
        const R0 = o.circle * U;
        if (e.mode === 'in') {
          const dx = e.cc.x + R0 - e.x, dy = e.cc.y - e.y, d = Math.hypot(dx, dy) || 1, st = Math.min(d, sp * U * dt);
          e.a = Math.atan2(dy, dx); e.x += dx / d * st; e.y += dy / d * st; if (d < 3 * U) { e.mode = 'circle'; e.ang = 0; }
        } else if (e.mode === 'circle') {
          e.ang += dt * sp * U / R0; e.x = e.cc.x + Math.cos(e.ang) * R0; e.y = e.cc.y + Math.sin(e.ang) * R0; e.a = e.ang + Math.PI / 2;
          if (o.scare && R() < dt * 0.5) scareKoi(e.x + 60 * U, e.y + 85 * U, 160 * U);
          if (e.ang > TAU * (o.turns || 2)) e.mode = 'out';
        } else { e.x += Math.cos(e.a) * sp * U * dt; e.y += Math.sin(e.a) * sp * U * dt; if (offscreen(e, 500 * U)) e.done = true; }
      } else {
        flyStep(e, dt, sp * U);
        if (o.scare && R() < dt * 0.6) scareKoi(e.x + 60 * U, e.y + 85 * U, 140 * U);   // koi dive from the passing shadow
      }

    draw(e, c, l) {
      if (l !== 'top') return;
      const ca = Math.cos(e.a), sa = Math.sin(e.a);
      for (const b of e.birds) {
        const x = e.x + b.bx * ca - b.by * sa, y = e.y + b.bx * sa + b.by * ca;
        birdWithShadow(c, x, y, e.a + (o.wobble ? Math.sin(e.ph * 0.3 + b.j) * 0.2 : 0), (o.size || 2) * U, { ...o.bird, flap: Math.sin(e.ph + b.ph) * (o.flapAmp ?? 1) }, o.alt ?? 1.2, 0.16);
      }
    } };
}

    },
    update(e, dt) {
      e.timer += dt; e.ph += dt;

}

function tryCatchKoi(e, reach, p, dt, maxL = 150) {
  const pt = l2w(e, reach, 0), k = nearestKoi(pt.x, pt.y, 45 * U, 0.45, maxL * U);
  if (k && R() < p * dt) { e.heldKoi = takeKoi(k); scareKoi(pt.x, pt.y, 250 * U); splash(pt.x, pt.y, 1.2); return true; }
  return false;
}
function mkEdge(title, w, o) {
  return { title, w, init: edgeVisitorInit,
    update(e, dt) {
      if (e.heldKoi && e.state === 'act') e.timer = Math.max(e.timer, (o.actT || 8) - 0.8);   // got one: time to go
      edgeVisitorUpdate(e, dt, o.act || (() => {}), o.actT || 8, o.speed || 60);
    },
    draw(e, c, l) {
      if (l !== 'top') return;
      const s = (o.size || 2.2) * U, sh = o.shadow || 20;
      c.fillStyle = 'rgba(0,0,0,0.3)'; c.beginPath(); c.ellipse(e.x + 8 * U, e.y + 11 * U, sh * s, sh * 0.55 * s, e.a, 0, TAU); c.fill();

      c.save(); c.translate(e.x, e.y); c.rotate(e.a); outlined(c, () => o.draw(c, s, e, e.state !== 'act')); c.restore();
    } };
}

EV.spawning = { title: 'The koi spawn among the lily pads', w: 1,
  init(e) {
    const l = plainKoi(); if (l.length < 2 || !pads.length) { e.done = true; return; }

  },
  update(e, dt) {
    const q = padPos(e.pad);

        for (let i = 0; i < 26; i++) { const a = R() * TAU, r = e.pad.r * (1.05 + R() * 0.5); e.eggs.push({ x: q.x + Math.cos(a) * r, y: q.y + Math.sin(a) * r, gone: false }); }
      }
    } else if (e.state === 'eggs') {
      if (e.t - e.st > 25) {                                       // the surviving eggs hatch
        e.state = 'fry'; e.st = e.t;
        for (const g of e.eggs) if (!g.gone) e.fry.push({ x: g.x, y: g.y, a: R() * TAU, ph: R() * TAU, gone: false });
        if (!e.fry.length) e.done = true;
      }
    } else {
      for (const f of e.fry) { if (f.gone) continue; f.ph += dt * 12; f.a += (R() - 0.5) * dt * 3; f.x += Math.cos(f.a) * 15 * U * dt; f.y += Math.sin(f.a) * 15 * U * dt;
        if (!inPond(f.x, f.y, 30 * U)) { const m = pondMid(); f.a = Math.atan2(m.y - f.y, m.x - f.x); } }
      if (e.t - e.st > 50) {

          const f = left[0], k = new Koi(f.x, f.y); k.L = 55 * U; k.seg = k.L / (k.N - 1);
          for (let i = 1; i < k.N; i++) { k.pts[i].x = k.pts[0].x - Math.cos(k.heading) * k.seg * i; k.pts[i].y = k.pts[0].y - Math.sin(k.heading) * k.seg * i; }
          k.depth = 0.5; koi.push(k); koiTarget++; toastMsg('One of the fry grew into a new koi!');

    if (kind === 'fish' || kind === 'koifood') for (const f of e.fry) if (!f.gone) out.push({ x: f.x, y: f.y, take() { f.gone = true; } });
